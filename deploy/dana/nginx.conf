server {
  listen 8080;
  root /usr/share/nginx/html;
  # Hashed build assets + the content bundle are served strictly — a deep-route
  # request for a missing asset must 404, never fall back to index.html (the
  # browser would refuse HTML served as a module and the app would never boot).
  location /assets/ {
    try_files $uri =404;
  }
  location = /content.json {
    try_files $uri =404;
  }
  # SPA: unknown routes fall back to the app shell.
  location / {
    try_files $uri /index.html;
  }
}
