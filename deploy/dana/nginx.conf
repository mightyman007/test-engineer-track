server {
  listen 8080;
  root /app/apps/web/dist;
  # The API runs in this container; the edge injects X-User-Token which the
  # API's SSO middleware resolves into an app session.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-User-Token $http_x_user_token;
  }
  # Hashed assets + the content bundle serve strictly — a deep-route request
  # for a missing file must 404, never fall back to index.html.
  location /assets/ {
    try_files $uri =404;
  }
  location = /content.json {
    try_files $uri =404;
  }
  # SPA: unknown routes fall back to the app shell (deep links work).
  location / {
    try_files $uri /index.html;
  }
}
