[[question]]
id = "istqb-q-0170"
type = "single"
stem = "A team buys a test-execution tool and expects it to design thorough test cases for their untested legacy module. Six months later regression coverage is unchanged and the tool's scripts just replay the same few flows. What went wrong?"
options = [
  "They chose an execution tool when a static-analysis tool was needed",
  "Automation always reduces coverage; manual-only teams do better",
  "They expected the tool to replace test design — tools execute and check, they don't decide WHAT to test",
  "The legacy module was too large — no tool can test legacy code",
]
answers = [2]
explanation = "Tools amplify a test approach; they don't create one. Test DESIGN (what to test, with what coverage) stays a human responsibility — a classic automation risk per the syllabus. Static analysis is unrelated to execution tooling here."
lo = "FL-6.2.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0171"
type = "single"
stem = "Which statement describes a potential benefit of test automation, as stated in the syllabus?"
options = [
  "Reduced test execution times provide earlier defect detection, faster feedback and faster time to market",
  "Automated suites guarantee that every defect in the product will be found before release",
  "Automation eliminates the need for testers to design new test cases",
  "Automated tools replace the tester's judgment in evaluating test results",
]
answers = [0]
explanation = "Reduced execution times leading to earlier defect detection, faster feedback and faster time to market is one of the syllabus's six potential benefits. No tooling guarantees all defects are found; automation leaves testers MORE time to design new tests; and evaluating results still needs human judgment."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0172"
type = "single"
stem = "A lead wants code violations — unreachable branches, duplicated blocks, coding-standard breaches — flagged automatically before the code reaches review. Which tool family fits this need?"
options = [
  "Test execution and test coverage tools — they run the unit suite and report which lines executed",
  "Test management tools — they track the violations as defects until they are fixed",
  "Test design and test implementation tools — they generate test cases from the coding standard",
  "Static testing tools — they support reviews and static analysis of code without executing it",
]
answers = [3]
explanation = "Static analysis examines code without executing it — the static testing tools' job, and flagging violations automatically pre-review is their classic use. Execution and coverage tools run tests (dynamic); management tools track defects but don't find violations; design tools generate tests, not rule checks."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0173"
type = "single"
stem = "A team automates its regression suite and the three-day manual regression cycle drops to two hours of unattended execution. Which potential benefit of test automation does the freed-up tester capacity directly represent?"
options = [
  "More objective assessment of the product's coverage figures",
  "More time for testers to design new, deeper and more effective tests",
  "Prevention of simple human errors through greater repeatability",
  "Easier access to information about test progress for reporting",
]
answers = [1]
explanation = "The hours automation returns are meant to be reinvested in designing new, deeper and more effective tests — the syllabus's final benefit. Objective assessment, error prevention through repeatability and reporting access are benefits of the automation itself, not of the freed-up tester capacity."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0174"
type = "single"
stem = "A tester matches the syllabus's tool families to their stated purposes while revising. Which pairing is correct?"
options = [
  "Test design and test implementation tools — facilitate automated test execution and coverage measurement",
  "Test management tools — facilitate generation of test cases, test data and test procedures",
  "Static testing tools — increase test process efficiency by managing the SDLC, requirements, tests, defects and configuration",
  "Test execution and test coverage tools — facilitate automated test execution and coverage measurement",
]
answers = [3]
explanation = "The syllabus assigns automated test execution and coverage measurement to test execution and test coverage tools. The other pairings swap purposes: design/implementation tools generate cases, data and procedures; management tools manage the SDLC, requirements, tests, defects and configuration; static testing tools support reviews and static analysis."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0175"
type = "single"
stem = "Which potential benefit of test automation is a tester invoking when they argue that a tool should compute code coverage across the whole system, because no human could tally that by hand?"
options = [
  "More objective assessment, and providing measures that are too complicated for humans to determine",
  "Reduced test execution times through unattended execution",
  "Prevention of simple human errors through greater consistency",
  "More time for testers to design new and deeper tests",
]
answers = [0]
explanation = "Coverage across a whole system is the syllabus's own territory here: more objective assessment (e.g., coverage) and measures too complicated for humans to determine. Execution speed, error prevention and freed-up design time are other benefits that do not describe why the measurement itself needs a tool."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0176"
type = "single"
stem = "A performance team must simulate 5,000 concurrent users placing orders to measure response times under peak load. Why is a dedicated test tool the realistic way to conduct this test?"
options = [
  "Because the test must be repeatable, and only tools repeat tests",
  "Because it is non-functional testing that is difficult or impossible to perform manually — the tool generates and coordinates the load",
  "Because manual performance testing would produce subjective coverage numbers",
  "Because non-functional requirements are always verified by static analysis tools",
]
answers = [1]
explanation = "The syllabus's non-functional testing tools exist to allow testing that is difficult or impossible to perform manually — coordinating thousands of simulated users is the textbook case. Repeatability alone does not require this class of tool, coverage numbers are not the issue, and static analysis never executes the system."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0177"
type = "single"
stem = "A team wants every commit to trigger an automated build and a full automated regression run, with failures blocking the merge, all orchestrated in one pipeline. Which tool family supports this way of working?"
options = [
  "Test design and test implementation tools",
  "Scalability and deployment standardization tools",
  "DevOps tools — delivery pipeline, workflow tracking, automated builds, CI/CD",
  "Collaboration tools",
]
answers = [2]
explanation = "Commit-triggered builds and test runs gating the merge are continuous integration/delivery — the syllabus's DevOps tools territory: delivery pipeline, workflow tracking, automated build processes, CI/CD. Design tools create tests, deployment-standardization tools provide environments, collaboration tools communicate — none operates the pipeline."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0178"
type = "single"
stem = "A stakeholder reads a tool vendor's brochure and instructs the team to buy the tool because 'it will find all the bugs automatically.' Which potential risk of test automation does this illustrate?"
options = [
  "Unrealistic expectations about the benefits of a tool, including functionality and ease of use",
  "Using a test tool when manual testing is more appropriate",
  "Choosing a tool that does not comply with regulatory requirements",
  "Dependency on the tool vendor which may go out of business",
]
answers = [0]
explanation = "'Finds all the bugs automatically' is the syllabus's first named risk: unrealistic expectations about a tool's benefits, including functionality and ease of use. The other risks concern when tools are used, what they comply with and whom they depend on — none describes a mistaken belief about what the tool will deliver."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0179"
type = "single"
stem = "Which statement about what counts as a test tool is consistent with the syllabus?"
options = [
  "Only dedicated, commercially licensed tools purchased for the test team count as test tools",
  "Only tools that execute tests count; tools supporting planning or analysis are not test tools",
  "Open-source utilities never count as test tools because they have no vendor",
  "Any tool that assists in testing counts — the syllabus notes even a spreadsheet is a test tool in the context of testing",
]
answers = [3]
explanation = "The syllabus's list closes with 'any other tool that assists in testing', giving the spreadsheet example to make the boundary functional, not commercial or technical. Limiting test tools to purchased, execution-only or vendor-backed software would exclude categories the syllabus explicitly includes (test management, static analysis, DevOps, collaboration)."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0180"
type = "single"
stem = "A company builds its entire test automation on a single commercial tool from one small vendor. Which potential risk does the syllabus attach to depending on that vendor?"
options = [
  "That the team's regression tests will keep running in the same order with the same frequency",
  "The vendor may go out of business, retire the tool, sell it to a different vendor, or provide poor support",
  "That test reporting will automatically become more objective over time",
  "That the tool will keep generating deeper test cases without tester involvement",
]
answers = [1]
explanation = "Vendor dependency is a named risk: the vendor may go out of business, retire the tool, sell the tool to a different vendor, or provide poor support (responses to queries, upgrades, defect fixes). The other options restate benefits or hopes, not the risk the syllabus attaches to depending on a vendor."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0181"
type = "single"
stem = "Which statement about test tools is consistent with the syllabus?"
options = [
  "A well-chosen tool suite guarantees the quality of the released product",
  "Once a test-execution tool is in place, test analysis and design become tool activities",
  "Tools support and facilitate test activities, while testing remains largely an intellectual activity requiring critical thinking",
  "Tools are most valuable when they replace manual testing in every situation",
]
answers = [2]
explanation = "The syllabus's framing is supportive, not substitutive: tools support and facilitate test activities, and testing is largely an intellectual activity requiring specialized knowledge, analytical skill and critical and systems thinking. Tools guarantee nothing, test design stays human, and replacing manual testing in every situation is itself a named automation risk."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0182"
type = "single"
stem = "A tester wants to automate a one-off exploratory session scheduled on a brand-new feature prototype that will be redesigned next week. Which potential risk of test automation does the syllabus warn this team about?"
options = [
  "Using a test tool when manual testing is more appropriate",
  "Choosing an unsuitable tool that does not comply with safety standards",
  "Inaccurate estimation of the effort to introduce the tool",
  "Dependency on the vendor that built the prototype",
]
answers = [0]
explanation = "Automating a one-off, judgment-driven session on throwaway code is the syllabus's 'using a test tool when manual testing is more appropriate' risk. Compliance, introduction effort and vendor dependency are real tool-adoption risks generally, but none describes why this particular automation is misplaced."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0183"
type = "single"
stem = "A team wants one place that links each requirement to the tests covering it, each test to its current result, and each failed test to its defect and the affected configuration item. Which tool family's stated purpose covers all of this?"
options = [
  "Collaboration tools — they facilitate communication about these links",
  "Test execution tools — they log each result, and nothing else is needed",
  "Test management tools — they facilitate management of the SDLC, requirements, tests, defects and configuration",
  "Test design tools — they generate the traceability matrix from the test basis",
]
answers = [2]
explanation = "Requirements-to-tests-to-defects-to-configuration in one place is exactly the test management tools' syllabus purpose: increasing test process efficiency by facilitating management of the SDLC, requirements, tests, defects and configuration. Collaboration tools only communicate; execution tools log results but don't manage the relationships; design tools generate tests, not the management view."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0184"
type = "single"
stem = "Six months into an automation project, the team admits its budget was spent entirely on tool licenses and initial script recording, and the scripts now break with every interface change. Which potential risk of test automation did the team fall into?"
options = [
  "Relying on the tool too much, ignoring human critical thinking",
  "Using open-source software which may be abandoned",
  "The tool not being compatible with the development platform",
  "Inaccurate estimation of the time, costs and effort to introduce the tool and maintain test scripts",
]
answers = [3]
explanation = "The missing budget lines — maintaining scripts against changing interfaces, plus changing the existing manual test process — are the syllabus's 'inaccurate estimations of time, costs, effort required to introduce a tool, maintain test scripts and change the existing manual test process'. Over-reliance, abandonment and incompatibility are different risks the scenario gives no evidence of."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0185"
type = "single"
stem = "A pricing engine applies 40 discount rules; the test team must exercise every rule combination the specification allows — far more combinations than any analyst could write by hand. Which tool family directly addresses this need?"
options = [
  "Non-functional testing tools, because the volume of combinations is a load problem",
  "Test design and test implementation tools — they facilitate generation of test cases and test data",
  "Test management tools, which can assign the combinations to testers in bulk",
  "Collaboration tools, so the team can split the combinations among members",
]
answers = [1]
explanation = "The need is generated test cases and especially test data at a volume humans cannot produce — the syllabus's test design and test implementation tools. A combination explosion is a functional test-data problem, not load testing; managing or distributing the work does not create the tests."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]

[[question]]
id = "istqb-q-0186"
type = "single"
stem = "Which definition matches the syllabus keyword 'test automation'?"
options = [
  "The use of software to perform or support test activities, e.g., test management, test design, test execution and results checking",
  "The replacement of all manual test activities by scripts, so that no human performs testing",
  "The execution of the software under test by a tool instead of by a person",
  "The automated generation of the product's code from its automated tests",
]
answers = [0]
explanation = "Test automation is defined as the use of software to perform or support test activities — with test management, test design, test execution and results checking given as examples, i.e., much broader than clicking scripts. Replacing all human testing, executing only the product, or generating product code are not the definition."
lo = "FL-6.2.1"
klevel = "K1"
tags = ["ch6"]

[[question]]
id = "istqb-q-0187"
type = "multi"
stem = "A fintech team reports two gaps: (1) coding-standard violations and suspicious code patterns keep reaching code review unnoticed, and (2) after every release nobody can say how much of the code the automated regression suite actually exercised. Which TWO tool families, from the syllabus's list, directly close these gaps?"
options = [
  "Static testing tools",
  "Collaboration tools",
  "Test execution and test coverage tools",
  "Non-functional testing tools",
  "Test management tools",
]
answers = [0, 2]
explanation = "Gap 1 is analysis without execution — static testing tools support reviews and static analysis; gap 2 is coverage measurement of executed tests — test execution and test coverage tools facilitate automated test execution and coverage measurement. Collaboration, non-functional and test management tools support communication, hard-to-do-manually testing and management of the SDLC/tests/defects/configuration — none finds code violations or measures coverage by itself."
lo = "FL-6.1.1"
klevel = "K2"
tags = ["ch6"]
