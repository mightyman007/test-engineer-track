#       was renumbered into this module's range as istqb-q-0099;
#   (b) Step-1 verification ruling — the brief's 3-value stem keyed "6", but per
#       syllabus §4.2.2 a 3-value BVA on that scenario yields 12 distinct values
#       (the brief's own explanation enumerated nine values: 49/50/51, 99/100/101,
#       199/200/201). The stem was corrected to 2-value BVA, which yields the
