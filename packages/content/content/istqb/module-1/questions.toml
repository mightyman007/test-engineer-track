# "Exam Structures & Rules tables" document (ch1 block of its question-distribution table, decoded
# from cell coordinates: K1 groups {FL-1.1.1, FL-1.2.2} -> 1 question, {FL-1.5.2} -> 1 question;
# K2 groups {FL-1.1.2, FL-1.2.1, FL-1.2.3} -> 1, {FL-1.3.1} -> 1, {FL-1.4.1..FL-1.4.5} -> 3,
# {FL-1.5.1, FL-1.5.3} -> 1; chapter total 8 questions, K1=2 / K2=6 / K3=0 — matching the ASTQB
# chapter-weight table's ch1=8). Both sources agree on the per-LO K classification:
#   FL-1.1.1 (K1) Identify typical test objectives
#   FL-1.1.2 (K2) Differentiate testing from debugging
#   FL-1.2.1 (K2) Exemplify why testing is necessary
