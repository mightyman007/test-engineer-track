# q-0191) — the two multi-selects keep their original keys ([0,2] and [0,1]) and q-0012 (2) /
# q-0014 (0) were authored at their balanced positions. The id-order sequence 1,2,0,2,0,3,2,0,
# 1,2,1,2,1,0,2,1,2,1,3,0,... is scattered with ZERO adjacent repeats (deliberately not a
# cycle, per the module-4/5 pattern). Every reordered question's keyed-option
