#   istqb-q-0012 K1 -> K2 (M4 consistency pass: the M2 K1 tag rode on a keyword-recall stem, which
#                          the re-stem below replaces with a genuine §1.5.1 skill scenario —
#                          identifying attention to detail in action — so the tag now follows the
#                          official FL-1.5.1 classification, K2)
#   K1 tags that REMAIN on K2 LOs (q-0007, q-0010, q-0015, q-0019, q-0021, q-0023, q-0025)
#   are keyword/concept-recall questions the syllabus itself authorizes: §0.5 states "all contents
#   of chapters 1-6 of this syllabus are examinable at a K1 level" — the same rule module-4's
#   header cites. Re-tagging them K2 would mislabel genuine recall; re-stemming them into K2
#   scenarios would duplicate the K2 questions already covering those LOs.
#
# M4 consistency pass (ledgered from the M2/M3 final reviews; rationale in task-8-report.md):
#   q-0012 re-stemmed from the "what is a heuristic?" keyword recall to an attention-to-detail
#   scenario (a genuine §1.5.1 skill; the heuristic definition already lives in lesson-05's prose),
#   keyed at position 2, klevel K2 per the official FL-1.5.1 classification.
#   q-0014 re-stemmed to break the q-0014/q-0032 near-duplicate: q-0032 keeps the taxonomy angle
#   (testing = product-oriented QC, QA = process-oriented prevention); q-0014 now asks WHY the
#   QA/testing line matters for a tester's day job — the division of labor plus the results-feedback
#   loop the syllabus states in §1.2.2 ("test results are used ... in QA as feedback on how well
#   the development and test processes are performing"). The re-stem's keyed content is the
#   QA/testing RELATION, which is §1.2.2 material, so it stays keyed FL-1.2.2 (K1 recognition,
#   same precedent as q-0028) — re-keying it to FL-1.2.1 would both mis-key the content and drop
#   FL-1.2.2 below the every-LO->=2 coverage floor, since q-0032 is the only other FL-1.2.2 here.
#
# Answer-position balance (M4 consistency pass, standing rule): the module shipped 18/14/3/1
# across keyed positions 0-3; now exactly 9/9/9/9 after 14 option reorders (q-0002, q-0004,
