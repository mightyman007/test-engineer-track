[[question]]
id = "istqb-q-0166"
type = "single"
stem = "Why does configuration management matter for TESTING specifically — what does it buy the test process?"
options = [
  "It lets the team revert to a previous baseline to reproduce previous test results, and keeps configuration items uniquely identified and traceable throughout the test process",
  "It automatically fixes the defects found in earlier baselines",
  "It replaces the test completion report with version histories",
  "It guarantees that every test execution passes on the newest baseline",
]
answers = [0]
explanation = "CM ensures all configuration items (including test items) are uniquely identified, version controlled, tracked and related so traceability is maintained — and, because new baselines record what changed, a previous baseline can be restored to reproduce previous test results. It fixes nothing, replaces no report, and guarantees no outcome."
