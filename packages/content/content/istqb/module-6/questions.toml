[[question]]
id = "istqb-q-0169"
type = "single"
stem = "A one-pixel logo misalignment appears on the bank's public homepage. It breaks nothing, but the marketing campaign launches tomorrow and the homepage must look perfect for it. How should the defect be classified?"
options = [
  "High severity (it sits on the public homepage), low priority (nothing breaks)",
  "High severity and high priority — public visibility raises both together",
  "Low severity (trivial impact), high priority (the fix is urgent for tomorrow's launch)",
  "Low severity and low priority — nothing breaks, so nothing is urgent",
]
answers = [2]
