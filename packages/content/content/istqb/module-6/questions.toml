[[question]]
id = "istqb-q-0165"
type = "single"
stem = "A test suite was approved for testing and became a baseline. A developer now wants to edit two of its test cases directly. What does configuration management require?"
options = [
  "Nothing — test cases are never configuration items",
  "A direct edit is fine as long as the test results still pass",
  "The whole baseline must be deleted and re-created from scratch",
  "The change must go through the formal change control process — a baseline can only be changed that way",
]
answers = [3]
explanation = "If a configuration item is approved for testing it becomes a baseline and can only be changed through a formal change control process. Test cases and test scripts are explicitly configuration items, and CM's remedy is change control, not deletion."
