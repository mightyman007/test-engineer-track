[[question]]
id = "istqb-q-0137"
type = "multi"
stem = "A test manager is assembling a new test plan for a regulated payments project. Which TWO of the following items belong in the typical content of a test plan?"
options = [
  "The defect reports logged during test execution, with their severities",
  "The context of testing — test scope, test objectives, test basis",
  "The full text of the corporate test policy the project must follow",
  "The risk register — product risks and project risks",
  "The production database credentials for the test environment",
]
answers = [1, 3]
explanation = "Typical test-plan content includes the context of testing and the risk register, alongside assumptions/constraints, stakeholders, communication, the test approach, and budget/schedule. Defect reports are gathered during execution rather than planned; the policy is something the plan adheres to (or explains deviations from), not reproduces; and credentials are environment configuration, not a plan section."
lo = "FL-5.1.1"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0138"
type = "single"
stem = "A team's test plan contains a section explaining that one subsystem will be tested with exploratory charters instead of the corporation's standard scripted technique. Which purpose of test planning does that section serve?"
options = [
  "Demonstrating that testing will adhere to the existing test policy and test strategy — or explaining why the testing will deviate from them",
  "Documenting the means and schedule for achieving the test objectives",
  "Serving as a means of communication with team members and other stakeholders",
  "Helping to ensure the performed test activities will meet the established criteria",
]
answers = [0]
explanation = "Explaining a deviation from the standard approach is exactly the adhere-or-explain purpose. Documenting means/schedule, communicating with stakeholders, and meeting the established criteria are the plan's other jobs, not this one."
lo = "FL-5.1.1"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0139"
type = "single"
stem = "Which contribution is a tester's typical role in ITERATION planning, as opposed to release planning?"
options = [
  "Defining and re-defining the product backlog for the release",
  "Breaking down user stories into tasks, particularly testing tasks",
  "Determining the test approach to be used across all iterations",
  "Refining larger user stories into sets of smaller user stories",
]
answers = [1]
explanation = "Iteration planning works on the single iteration backlog: detailed risk analysis of the stories, their testability, breaking them into tasks (particularly testing tasks), estimating the testing tasks, and refining functional and non-functional aspects. Defining the backlog, refining large stories, and setting the cross-iteration test approach belong to release planning."
lo = "FL-5.1.2"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0140"
type = "single"
stem = "Which contribution belongs to RELEASE planning rather than iteration planning?"
options = [
  "Participating in the detailed risk analysis of user stories",
  "Determining the testability of the iteration's user stories",
  "Participating in writing testable user stories and acceptance criteria",
  "Estimating test effort for all of the iteration's testing tasks",
]
answers = [2]
explanation = "Release planning looks ahead to the whole release: testers help write testable user stories and acceptance criteria, join project and quality risk analyses, estimate the test effort associated with user stories, determine the test approach, and plan release testing. The other three options are iteration-planning contributions."
lo = "FL-5.1.2"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0141"
type = "single"
stem = "A team is deciding what must be true before system testing may start. Which of the following is a typical ENTRY criterion for a test level?"
options = [
  "The number of unresolved defects is below the agreed threshold",
  "All planned tests for the level have been executed",
  "The achieved level of coverage meets the target",
  "All smoke tests have passed on the build to be tested",
]
answers = [3]
explanation = "Entry criteria are preconditions: available resources and testware, and an initial quality level of the test object — e.g., all smoke tests have passed. Unresolved-defect counts, executed tests and achieved coverage are typical exit criteria (measures of thoroughness and binary yes/no criteria)."
lo = "FL-5.1.3"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0142"
type = "single"
stem = "In an Agile team, the user story 'password reset' cannot move into development until its acceptance criteria are agreed and the design sketches exist. What does the syllabus call such story-level preconditions?"
options = [
  "Definition of Ready — the entry criteria a user story must fulfill to start development and/or testing activities",
  "Definition of Done — the team's objective metrics for a releasable item",
  "Exit criteria — what must be achieved to declare the iteration completed",
  "Test charter — the objective of an exploratory testing session",
]
answers = [0]
explanation = "Entry criteria that a user story must fulfill before development and/or testing start are called Definition of Ready. Definition of Done is the Agile name for exit criteria of a releasable item — the opposite direction — and a test charter belongs to exploratory testing."
lo = "FL-5.1.3"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0143"
type = "single"
stem = "A test-design task is estimated with the three-point technique: most optimistic a = 4, most likely m = 7, most pessimistic b = 16 person-hours. Using E = (a + 4·m + b) / 6 and SD = (b − a) / 6, what is the resulting estimate?"
options = [
  "9 person-hours — the simple average of a, m and b, with no error term",
  "8 ± 2 person-hours — between 6 and 10",
  "12.5 person-hours — weighting the pessimistic estimate instead: (a + 4·b + m) / 6",
  "8 ± 12 person-hours — the error taken as the full range (b − a) rather than (b − a)/6",
]
answers = [1]
explanation = "E = (4 + 4·7 + 16) / 6 = 48 / 6 = 8 and SD = (16 − 4) / 6 = 2, so the estimate is 8 ± 2 person-hours (between 6 and 10). The simple average (9) ignores both the weighting toward m and the error bar; weighting b instead of m inverts the lean (12.5); and the /6 belongs to the SD formula too."
lo = "FL-5.1.4"
klevel = "K3"
tags = ["ch5"]

[[question]]
id = "istqb-q-0144"
type = "single"
stem = "A previous, similar project's development-to-test effort ratio was 4:1. The current project expects 680 person-days of development effort. Using ratio-based estimation, what test effort should the team estimate?"
options = [
  "2,720 person-days — the ratio applied in reverse (test : development = 4 : 1)",
  "136 person-days — the development effort divided by five",
  "170 person-days — the 4:1 development-to-test ratio applied: 680 ÷ 4",
  "544 person-days — the ratio read as 4:5 and scaled: 680 × 4/5",
]
answers = [2]
explanation = "Ratio-based estimation applies the historical development-to-test ratio to the new project: 4:1 means test effort = 680 ÷ 4 = 170 person-days. Reversing the ratio (2,720), dividing by five (136) or rescaling 4/5 (544) each misread which side of the ratio the known figure sits on."
lo = "FL-5.1.4"
klevel = "K3"
tags = ["ch5"]

[[question]]
id = "istqb-q-0145"
type = "single"
stem = "Test case T1 has the highest priority but can only run after test case T2 — the lowest-priority test in the suite — has created the test data T1 needs. The test environment is available all week. How should the test execution schedule order these two test cases?"
options = [
  "T1 first — priority alone defines the test execution schedule",
  "T1 first, with T2 inserted only if execution time remains",
  "Either order — with a free environment, dependencies do not constrain scheduling",
  "T2 first — a lower-priority test case that a higher-priority test case depends on must be executed first",
]
answers = [3]
explanation = "Priority ordering yields to dependencies: if a higher-priority test case depends on a lower-priority one, the lower-priority one must be executed first. The freely available environment removes the resource-availability constraint, not the dependency."
lo = "FL-5.1.5"
klevel = "K3"
tags = ["ch5"]

[[question]]
id = "istqb-q-0146"
type = "single"
stem = "A team applies additional coverage prioritization, scheduling one test case at a time and each time picking the case that adds the most NEW coverage. The three test cases cover disjoint sets of coverage items: T1 adds 30% coverage, T2 adds 20%, T3 adds 25%. In what order are they scheduled?"
options = [
  "T1, then T3, then T2",
  "T3, then T1, then T2 — the case with the single highest coverage starts",
  "T1, then T2, then T3 — the order in which the estimates were produced",
  "T2, then T3, then T1 — smallest additions first to bank quick wins",
]
answers = [0]
explanation = "Additional coverage prioritization is greedy: the first pick is the highest-coverage case (T1, 30%), and each subsequent pick is the case adding the most additional coverage to what is already scheduled — T3 (25%) then T2 (20%). Starting with T3 misreads the strategy, and estimate order or quick wins play no role in it."
lo = "FL-5.1.5"
klevel = "K3"
tags = ["ch5"]

[[question]]
id = "istqb-q-0147"
type = "single"
stem = "In the test pyramid model, what happens to the three properties as you move to a HIGHER layer?"
options = [
  "Test granularity increases, test isolation increases, test execution time decreases",
  "Test granularity decreases, test isolation decreases, test execution time increases",
  "All three increase — granularity, isolation and execution time",
  "All three decrease — higher layers are small, isolated and fast",
]
answers = [1]
explanation = "The higher the layer, the lower the test granularity, the lower the test isolation (dependency on other elements of the system), and the higher the test execution time. It is the bottom layer that holds the small, isolated, fast tests."
lo = "FL-5.1.6"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0148"
type = "single"
stem = "Why does a reasonable test pyramid usually need MANY tests in its bottom layer and only a FEW in its top layer?"
options = [
  "Bottom-layer tests are slower, so more of them are needed to fill the execution window",
  "Top-layer tests are cheaper to automate, so teams keep only a few for convenience",
  "Bottom-layer tests are small, isolated and fast but each checks only a small piece of functionality, while top-layer tests are complex, slower end-to-end checks that each cover a large piece",
  "Bottom-layer tests must compensate for the top layer's higher test isolation",
]
answers = [2]
explanation = "Bottom-layer tests are small, isolated, fast, and check a small piece of functionality — so many are needed for reasonable coverage. Top-layer tests are complex, high-level end-to-end checks that are slower but each cover a large piece of functionality — so only a few are needed. The inverted-property distractors swap the layers' characteristics."
lo = "FL-5.1.6"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0149"
type = "single"
stem = "An Agile team automates its component tests and component-integration tests and runs them in the continuous integration process. Which testing quadrant do these tests occupy?"
options = [
  "Q2 — business facing, supporting the team",
  "Q3 — business facing, critiquing the product",
  "Q4 — technology facing, critiquing the product",
  "Q1 — technology facing, supporting the team",
]
answers = [3]
explanation = "Q1 (technology facing, support the team) contains component tests and component integration tests, which should be automated and included in the CI process. Q2 holds the acceptance-criteria-facing functional tests, Q3 the user-oriented critique, Q4 smoke and non-functional tests."
lo = "FL-5.1.7"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0150"
type = "single"
stem = "A usability lab session watches real users struggle with a checkout flow. Which quadrant does this testing occupy — and what makes the classification?"
options = [
  "Q3 — business facing and critiquing the product: usability testing is user-oriented and often manual",
  "Q4 — technology facing and critiquing the product: all non-functional testing lives in Q4",
  "Q2 — business facing and supporting the team: it checks the acceptance criteria",
  "Q1 — technology facing and supporting the team: it guides the developers",
]
answers = [0]
explanation = "Q3 (business facing, critique the product) contains exploratory testing, usability testing and user acceptance testing. The Q4 trap: Q4 holds smoke tests and non-functional tests EXCEPT usability tests — usability is business-facing, not technology-facing."
lo = "FL-5.1.7"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0151"
type = "single"
stem = "Which two factors characterize a risk and together express its risk level?"
options = [
  "Severity and priority",
  "Risk likelihood and risk impact",
  "Cost and schedule delay",
  "Probability of detection and mean time to failure",
]
answers = [1]
explanation = "A risk is characterized by risk likelihood (the probability of its occurrence) and risk impact (the consequences of that occurrence); together they express the risk level. Severity and priority are defect-report fields, not risk attributes."
lo = "FL-5.2.1"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0152"
type = "single"
stem = "A risk is assessed at likelihood 4 on a 5-point scale and impact 3 on the same scale. In the quantitative approach, what is its risk level?"
options = [
  "7 — likelihood and impact added",
  "3.5 — the two values averaged",
  "12 — the multiplication of likelihood and impact",
  "0.75 — impact divided by likelihood",
]
answers = [2]
explanation = "In the quantitative approach the risk level is calculated as the multiplication of risk likelihood and risk impact: 4 × 3 = 12. Adding, averaging or dividing the two factors are not the syllabus's operation — and the higher the resulting level, the more important the risk's treatment."
lo = "FL-5.2.1"
klevel = "K1"
tags = ["ch5"]

[[question]]
id = "istqb-q-0153"
type = "single"
stem = "A payment-module defect is almost certain to recur (likelihood 5/5) and would incorrectly charge customers (impact 5/5). A logging typo in an admin screen is unlikely (2/5) with trivial impact (1/5). Using risk level = likelihood × impact and the project's rule that levels ≥ 12 get exhaustive testing while levels ≤ 4 get a single smoke check, what is the right allocation?"
options = [
  "Smoke checks for both — likelihood × impact totals are 25 and 2, both small",
  "Exhaustive for both — any defect touching money is automatically maximal",
  "Smoke for the payment defect; exhaustive for the typo (impact ratios invert)",
  "Exhaustive tests for the payment defect; smoke check for the typo",
]
answers = [3]
explanation = "Payment: 5 × 5 = 25 ≥ 12 → exhaustive. Typo: 2 × 1 = 2 ≤ 4 → smoke. The rule is mechanical once likelihood and impact are separated — 'touching money' is an impact driver, not a bypass of the computation."
lo = "FL-5.2.2"
klevel = "K3"
tags = ["ch5"]

[[question]]
id = "istqb-q-0154"
type = "single"
stem = "During a risk-analysis workshop, four risks are named. Which one is a PROJECT risk?"
options = [
  "The only engineer who understands the billing module has resigned, so the analysis may slip",
  "The billing module may calculate value-added tax on the gross amount instead of the net",
  "The checkout page may time out under peak load, driving customers away",
  "The exported invoices may show customer addresses in the wrong locale",
]
answers = [0]
explanation = "Project risks relate to management and control of the project — here a people issue (lost skills) threatening the schedule. Incorrect calculations, inadequate response time and wrong functionality are product risks: they hit quality characteristics and, through them, the users."
lo = "FL-5.2.2"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0155"
type = "single"
stem = "In a product risk workshop the team first brainstorms a list of 40 risks, then scores each one for likelihood and impact and groups them by feature area. Which risk-analysis stage does the SCORING belong to?"
options = [
  "Risk identification — generating a comprehensive list of risks",
  "Risk assessment — categorization, determining likelihood, impact and level, prioritizing, and proposing ways to handle them",
  "Risk mitigation — implementing the proposed actions to reduce the risk level",
  "Risk monitoring — checking that the mitigation actions are effective",
]
answers = [1]
explanation = "Risk identification is the brainstorming half (the 40-item list); scoring likelihood and impact, categorizing, prioritizing and proposing handling belong to risk assessment. Mitigation and monitoring are the two halves of risk control, not of analysis."
lo = "FL-5.2.3"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0156"
type = "single"
stem = "A product risk analysis has just produced likelihood, impact and level for every identified risk. Which test-management decision do these results DIRECTLY drive?"
options = [
  "Which SDLC model the project should follow",
  "Which programming language the test automation framework uses",
  "Which test techniques to employ and the level of coverage to achieve",
  "Which stakeholders receive the test completion report",
]
answers = [2]
explanation = "Product risk analysis results are used to determine the test scope, the test levels and types, the test techniques and coverage to be achieved, the per-task test effort, the prioritization of testing, and any additional risk-reducing activities. The SDLC model, the automation language and the report audiences are not among those uses."
lo = "FL-5.2.3"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0157"
type = "single"
stem = "The team implements the actions proposed in the risk assessment for its top product risk, and schedules a monthly check that those actions are actually working. Which two risk-control activities are these, in order?"
options = [
  "Risk monitoring, then risk mitigation",
  "Risk identification, then risk assessment",
  "Risk acceptance, then risk transfer",
  "Risk mitigation, then risk monitoring",
]
answers = [3]
explanation = "Risk mitigation means implementing the actions proposed in risk assessment to reduce the risk level; risk monitoring aims to ensure the mitigation actions are effective, to obtain further information, and to identify emerging risks. Identification/assessment are analysis stages; acceptance and transfer are response options."
lo = "FL-5.2.4"
klevel = "K2"
tags = ["ch5"]

[[question]]
id = "istqb-q-0158"
type = "single"
stem = "A team decides NOT to test a rarely used export feature at all, documents that decision, and prepares a rollback plan in case the feature misbehaves in production. Which response option to product risk does this illustrate?"
options = [
  "Risk acceptance — the documented decision to live with the risk, backed by a contingency plan",
  "Risk transfer — the responsibility moved to the operations team",
  "Risk mitigation by testing — the feature will still get exploratory sessions",
  "Risk avoidance — the feature is removed from the product",
]
answers = [0]
