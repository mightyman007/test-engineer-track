<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker>
    <marker id="arrred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Backpropagation, without the calculus: blame assignment</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">The prediction error flows backward; every connection carries a share of the blame</text>

  <circle cx="100" cy="190" r="26" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="100" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">x1</text>
  <circle cx="100" cy="310" r="26" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="100" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">x2</text>

  <circle cx="290" cy="190" r="28" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="290" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">h1</text>
  <circle cx="290" cy="310" r="28" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="290" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">h2</text>

  <circle cx="470" cy="250" r="34" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="470" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">out</text>

  <text x="200" y="180" text-anchor="middle" font-size="11.5" fill="#1a1a2e">forward &#8594;</text>
  <line x1="126" y1="190" x2="258" y2="190" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="126" y1="310" x2="258" y2="310" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="318" y1="190" x2="436" y2="234" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="318" y1="310" x2="436" y2="266" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="405" y="96" width="130" height="34" rx="8" fill="#f8ddd3" stroke="#c62828" stroke-width="2"/>
  <text x="470" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">error 1.0</text>
  <line x1="470" y1="132" x2="470" y2="212" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrred)"/>

  <line x1="438" y1="240" x2="324" y2="196" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrred)"/>
  <text x="392" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">blame 0.2</text>
  <line x1="438" y1="262" x2="324" y2="306" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrred)"/>
  <text x="392" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">blame 0.8</text>

  <line x1="258" y1="192" x2="130" y2="188" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.45" marker-end="url(#arrred)"/>
  <line x1="258" y1="308" x2="130" y2="312" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.45" marker-end="url(#arrred)"/>

  <rect x="585" y="140" width="190" height="190" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="680" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">who gets blamed?</text>
  <text x="600" y="196" font-size="12.5" fill="#1a1a2e">h2 pushed the wrong</text>
  <text x="600" y="214" font-size="12.5" fill="#1a1a2e">output hardest &#8594; blamed</text>
  <text x="600" y="232" font-size="12.5" fill="#1a1a2e">most: 0.8</text>
  <text x="600" y="260" font-size="12.5" fill="#1a1a2e">h1 barely contributed:</text>
  <text x="600" y="278" font-size="12.5" fill="#1a1a2e">0.2</text>
  <text x="600" y="306" font-size="12.5" fill="#1a1a2e">each weight then moves</text>
  <text x="600" y="324" font-size="12.5" fill="#1a1a2e">against its own share</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Blame flows backward in proportion to contribution &#8212; the heart of backpropagation, no calculus required.</text>
</svg>
