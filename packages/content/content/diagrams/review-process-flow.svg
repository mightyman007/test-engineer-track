<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Review Process (ISO/IEC 20246): Five Activities</text>
  <rect x="30" y="100" width="136" height="100" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="98" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">1. Planning</text>
  <text x="98" y="148" text-anchor="middle" font-size="11" fill="#1a1a2e">scope: purpose, work</text>
  <text x="98" y="164" text-anchor="middle" font-size="11" fill="#1a1a2e">product, exit criteria,</text>
  <text x="98" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">effort, timing</text>
  <line x1="168" y1="146" x2="182" y2="146" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="184" y="100" width="136" height="100" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="252" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">2. Review</text>
  <text x="252" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">initiation</text>
  <text x="252" y="164" text-anchor="middle" font-size="11" fill="#1a1a2e">everyone and everything</text>
  <text x="252" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">prepared: roles, access</text>
  <line x1="322" y1="146" x2="336" y2="146" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="338" y="100" width="136" height="100" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="406" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">3. Individual</text>
  <text x="406" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">review</text>
  <text x="406" y="164" text-anchor="middle" font-size="11" fill="#1a1a2e">each reviewer logs</text>
  <text x="406" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">anomalies + questions</text>
  <line x1="476" y1="146" x2="490" y2="146" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="492" y="100" width="136" height="100" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="560" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">4. Communication</text>
  <text x="560" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">and analysis</text>
  <text x="560" y="164" text-anchor="middle" font-size="11" fill="#1a1a2e">anomalies discussed:</text>
  <text x="560" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">status, owner, quality</text>
  <line x1="630" y1="146" x2="644" y2="146" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="646" y="100" width="136" height="100" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="714" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">5. Fixing and</text>
  <text x="714" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">reporting</text>
  <text x="714" y="164" text-anchor="middle" font-size="11" fill="#1a1a2e">a defect report per</text>
  <text x="714" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">defect; exit criteria</text>
  <text x="714" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">met: accept + report</text>
  <path d="M 560 200 L 560 240 L 406 240 L 406 206" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="483" y="258" text-anchor="middle" font-size="12.5" fill="#1a1a2e">a follow-up review may be required to complete actions</text>
  <text x="400" y="300" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Roles: Manager decides what to review and provides resources &#8226; Author creates and fixes</text>
  <text x="400" y="322" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Moderator (facilitator) runs a safe, effective meeting &#8226; Scribe (recorder) collates and records</text>
  <text x="400" y="344" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Reviewer examines the work product &#8226; Review leader owns the review &#8226; anomalies are not necessarily defects</text>
</svg>
