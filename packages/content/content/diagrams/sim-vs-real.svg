<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Simulation vs the real world</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">Coverage is won in sim &#8212; fidelity is won on the road. Mature programs need both.</text>

  <line x1="130" y1="370" x2="720" y2="370" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="370" x2="130" y2="110" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="430" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">scenario coverage &amp; scale &#8594;</text>
  <text x="200" y="398" text-anchor="middle" font-size="11" fill="#1a1a2e">a few miles</text>
  <text x="680" y="398" text-anchor="middle" font-size="11" fill="#1a1a2e">millions of runs</text>
  <text x="108" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e" transform="rotate(-90 108 240)">fidelity to reality</text>
  <text x="148" y="122" font-size="11" fill="#1a1a2e">the real world</text>
  <text x="148" y="356" font-size="11" fill="#1a1a2e">approximate</text>

  <circle cx="205" cy="150" r="10" fill="#0e7490"/>
  <text x="225" y="142" font-size="13" font-weight="700" fill="#1a1a2e">real road miles</text>
  <text x="225" y="162" font-size="11.5" fill="#1a1a2e">every input is real &#8212; rain, glare,</text>
  <text x="225" y="180" font-size="11.5" fill="#1a1a2e">tire wear, unpredictable people</text>
  <text x="225" y="198" font-size="11" font-weight="700" fill="#0e7490">perfect fidelity &#8212; but miles take years</text>

  <text x="620" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">simulated scenarios</text>
  <text x="620" y="214" text-anchor="middle" font-size="11.5" fill="#1a1a2e">dangerous variants rehearsed safely,</text>
  <text x="620" y="232" text-anchor="middle" font-size="11.5" fill="#1a1a2e">thousands overnight, on synthetic sensor data</text>
  <g fill="#16a34a">
    <circle cx="640" cy="300" r="4"/><circle cx="560" cy="322" r="4"/><circle cx="690" cy="272" r="4"/>
    <circle cx="600" cy="280" r="4"/><circle cx="548" cy="296" r="4"/><circle cx="660" cy="316" r="4"/>
    <circle cx="575" cy="258" r="4"/><circle cx="620" cy="336" r="4"/><circle cx="540" cy="268" r="4"/>
    <circle cx="700" cy="330" r="4"/><circle cx="630" cy="252" r="4"/><circle cx="590" cy="310" r="4"/>
  </g>
  <text x="610" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">huge coverage &#183; fidelity ceiling</text>

  <path d="M 590 322 Q 420 300 232 182" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#1a1a2e">the sim-to-real gap: a model can ace sim,</text>
  <text x="380" y="314" text-anchor="middle" font-size="11" fill="#1a1a2e">then stumble on real hardware</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Simulation buys scale and safety; the road keeps fidelity &#8212; mature programs need both.</text>
</svg>
