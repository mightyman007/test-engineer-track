<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Error &#8594; Defect &#8594; Failure</text>
  <text x="400" y="74" text-anchor="middle" font-size="15" fill="#1a1a2e">How a human mistake becomes a visible problem</text>
  <rect x="45" y="115" width="210" height="175" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="150" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">1 &#183; Error</text>
  <text x="150" y="175" text-anchor="middle" font-size="14" fill="#1a1a2e">A person makes a mistake</text>
  <text x="150" y="196" text-anchor="middle" font-size="14" fill="#1a1a2e">(a human action with an</text>
  <text x="150" y="217" text-anchor="middle" font-size="14" fill="#1a1a2e">incorrect result)</text>
  <text x="150" y="252" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">e.g. a developer types the</text>
  <text x="150" y="272" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">wrong condition in code</text>
  <line x1="262" y1="202" x2="310" y2="202" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="315" y="115" width="210" height="175" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="420" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">2 &#183; Defect</text>
  <text x="420" y="175" text-anchor="middle" font-size="14" fill="#1a1a2e">The mistake ends up as a</text>
  <text x="420" y="196" text-anchor="middle" font-size="14" fill="#1a1a2e">flaw in a work product</text>
  <text x="420" y="217" text-anchor="middle" font-size="14" fill="#1a1a2e">(code or a document)</text>
  <text x="420" y="252" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">also called a fault or bug;</text>
  <text x="420" y="272" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">it sits quietly in the code</text>
  <line x1="532" y1="202" x2="580" y2="202" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="585" y="115" width="210" height="175" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="690" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">3 &#183; Failure</text>
  <text x="690" y="175" text-anchor="middle" font-size="14" fill="#1a1a2e">When the flawed code runs,</text>
  <text x="690" y="196" text-anchor="middle" font-size="14" fill="#1a1a2e">the system deviates from</text>
  <text x="690" y="217" text-anchor="middle" font-size="14" fill="#1a1a2e">expected behaviour</text>
  <text x="690" y="252" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">e.g. a crash, a wrong total,</text>
  <text x="690" y="272" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">a slow response</text>
  <rect x="45" y="330" width="750" height="90" rx="12" fill="#eef1f8" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="420" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Three things to remember</text>
  <text x="420" y="384" text-anchor="middle" font-size="13.5" fill="#1a1a2e">&#8226; Not every defect causes a failure &#8212; some flawed code never runs. &#8226; Failures can also come from the environment:</text>
  <text x="420" y="404" text-anchor="middle" font-size="13.5" fill="#1a1a2e">radiation or electromagnetic fields can cause defects in firmware. &#8226; Testing finds failures; debugging removes their causes.</text>
</svg>
