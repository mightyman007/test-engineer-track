<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker>
  <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Attention: every word weighs the words around it</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">Reading &#8220;it&#8221; means deciding which earlier word it stands for &#8212; the weights decide</text>

  <g stroke="#1a1a2e" stroke-width="1.5" fill="#ffffff">
    <rect x="60" y="110" width="70" height="36"/><rect x="140" y="110" width="76" height="36"/><rect x="226" y="110" width="60" height="36"/>
    <rect x="296" y="110" width="46" height="36"/><rect x="352" y="110" width="52" height="36"/><rect x="414" y="110" width="66" height="36"/>
    <rect x="490" y="110" width="76" height="36"/><rect x="574" y="110" width="66" height="36"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1a1a2e">
    <text x="95" y="133">The</text><text x="178" y="133">animal</text><text x="256" y="133">did</text>
    <text x="319" y="133">not</text><text x="378" y="133">cross</text><text x="447" y="133">the</text>
    <text x="528" y="133">street</text><text x="607" y="133">because</text>
  </g>
  <rect x="650" y="110" width="44" height="36" fill="#b26a00" fill-opacity="0.15" stroke="#b26a00" stroke-width="2"/>
  <text x="672" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#b26a00">it</text>

  <path d="M 660 150 C 560 235, 300 235, 186 152" fill="none" stroke="#b26a00" stroke-width="5" marker-end="url(#arr)"/>
  <text x="420" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#b26a00">weight 0.7 &#8212; &#8220;&#8230;because it was too tired&#8221;</text>
  <path d="M 668 150 C 650 205, 596 215, 540 152" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <text x="612" y="196" text-anchor="middle" font-size="11" fill="#16a34a">0.1</text>

  <rect x="60" y="270" width="614" height="40" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="367" y="295" text-anchor="middle" font-size="14" fill="#1a1a2e">same sentence, but now it ends &#8220;&#8230;because it was too wide&#8221;</text>
  <path d="M 690 285 C 700 335, 420 350, 200 332" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#arr2)"/>
  <text x="470" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">weight 0.7 &#8212; now &#8220;street&#8221; is the one that can be wide</text>

  <text x="400" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Same word, different weights: attention scores every context candidate against the task at hand.</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Attention is learned, not programmed &#8212; probe it with input pairs, not by reading rules.</text>
</svg>
