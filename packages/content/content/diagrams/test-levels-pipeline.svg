<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Five Test Levels &#8212; who tests, on what, and when</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">Test levels are groups of test activities organized and managed together</text>
  <rect x="40" y="90" width="330" height="52" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="55" y="112" font-size="14.5" font-weight="700" fill="#1a1a2e">1. Component (unit) testing</text>
  <text x="55" y="132" font-size="12.5" fill="#1a1a2e">one piece on its own, in isolation</text>
  <rect x="40" y="152" width="330" height="52" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="55" y="174" font-size="14.5" font-weight="700" fill="#1a1a2e">2. Component integration testing</text>
  <text x="55" y="194" font-size="12.5" fill="#1a1a2e">interfaces between the pieces</text>
  <rect x="40" y="214" width="330" height="52" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="55" y="236" font-size="14.5" font-weight="700" fill="#1a1a2e">3. System testing</text>
  <text x="55" y="256" font-size="12.5" fill="#1a1a2e">the whole system, end to end</text>
  <rect x="40" y="276" width="330" height="52" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="55" y="298" font-size="14.5" font-weight="700" fill="#1a1a2e">4. System integration testing</text>
  <text x="55" y="318" font-size="12.5" fill="#1a1a2e">our system + other systems it talks to</text>
  <rect x="40" y="338" width="330" height="52" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="55" y="360" font-size="14.5" font-weight="700" fill="#1a1a2e">5. Acceptance testing</text>
  <text x="55" y="380" font-size="12.5" fill="#1a1a2e">does it serve the users' business needs?</text>
  <line x1="205" y1="142" x2="205" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="204" x2="205" y2="212" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="266" x2="205" y2="274" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="328" x2="205" y2="336" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="415" y="106" font-size="13" font-weight="700" fill="#1a1a2e">Who: developers</text>
  <text x="415" y="124" font-size="12" fill="#1a1a2e">in their own dev environment,</text>
  <text x="415" y="140" font-size="12" fill="#1a1a2e">often with test harnesses</text>
  <text x="415" y="168" font-size="13" font-weight="700" fill="#1a1a2e">When: as pieces are built</text>
  <text x="415" y="186" font-size="12" fill="#1a1a2e">strategy matters: big-bang,</text>
  <text x="415" y="202" font-size="12" fill="#1a1a2e">top-down, or bottom-up</text>
  <text x="415" y="230" font-size="13" font-weight="700" fill="#1a1a2e">Who: often an independent test team</text>
  <text x="415" y="248" font-size="12" fill="#1a1a2e">basis: specifications; needs a</text>
  <text x="415" y="264" font-size="12" fill="#1a1a2e">representative environment</text>
  <text x="415" y="292" font-size="13" font-weight="700" fill="#1a1a2e">What: interfaces to external services</text>
  <text x="415" y="310" font-size="12" fill="#1a1a2e">test environment close to the</text>
  <text x="415" y="326" font-size="12" fill="#1a1a2e">real operational one</text>
  <text x="415" y="354" font-size="13" font-weight="700" fill="#1a1a2e">Who: ideally the intended users</text>
  <text x="415" y="372" font-size="12" fill="#1a1a2e">UAT, operational, contractual,</text>
  <text x="415" y="388" font-size="12" fill="#1a1a2e">regulatory, alpha, beta</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Levels differ by test object, objectives, test basis, typical defects, and responsibilities.</text>
</svg>