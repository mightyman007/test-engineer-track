<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Learning Loop</text>
  <text x="400" y="74" text-anchor="middle" font-size="15" fill="#1a1a2e">Every technique in this lesson is one stop on this loop</text>

  <!-- FOCUS (top) -->
  <rect x="310" y="100" width="180" height="76" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">1 &#183; FOCUS</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#1a1a2e">One Pomodoro: watch, read,</text>
  <text x="400" y="167" text-anchor="middle" font-size="13" fill="#1a1a2e">take notes from memory</text>

  <!-- RECALL (right) -->
  <rect x="530" y="215" width="180" height="76" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="620" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">2 &#183; RECALL</text>
  <text x="620" y="265" text-anchor="middle" font-size="13" fill="#1a1a2e">Book closed: quiz yourself,</text>
  <text x="620" y="282" text-anchor="middle" font-size="13" fill="#1a1a2e">answer flashcards</text>

  <!-- SPACE (bottom) -->
  <rect x="310" y="330" width="180" height="76" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="400" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">3 &#183; SPACE</text>
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#1a1a2e">SM-2 schedules the next review</text>
  <text x="400" y="397" text-anchor="middle" font-size="13" fill="#1a1a2e">just before you'd forget</text>

  <!-- REST (left) -->
  <rect x="90" y="215" width="180" height="76" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="180" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">4 &#183; REST</text>
  <text x="180" y="265" text-anchor="middle" font-size="13" fill="#1a1a2e">Diffuse mode: walk, sleep &#8212;</text>
  <text x="180" y="282" text-anchor="middle" font-size="13" fill="#1a1a2e">the brain connects the dots</text>

  <!-- clockwise arrows -->
  <line x1="474" y1="171" x2="548" y2="212" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="548" y1="294" x2="474" y2="335" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="326" y1="335" x2="252" y2="294" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="252" y1="212" x2="326" y2="171" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- center -->
  <text x="400" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">REPEAT</text>
  <text x="400" y="264" text-anchor="middle" font-size="13" fill="#1a1a2e">each pass flattens</text>
  <text x="400" y="281" text-anchor="middle" font-size="13" fill="#1a1a2e">the forgetting curve</text>

  <!-- footnotes -->
  <text x="400" y="432" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a2e">Struggling to recall is not failure &#8212; the struggle is the learning happening.</text>
</svg>
