<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Review Type Ladder: Four Rungs of Formality</text>
  <rect x="30" y="292" width="176" height="112" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="118" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Informal review</text>
  <text x="118" y="342" text-anchor="middle" font-size="11.5" fill="#1a1a2e">no defined process, no</text>
  <text x="118" y="358" text-anchor="middle" font-size="11.5" fill="#1a1a2e">formal documented output</text>
  <text x="118" y="378" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">objective: detecting</text>
  <text x="118" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">anomalies</text>
  <rect x="218" y="222" width="176" height="182" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="306" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Walkthrough</text>
  <text x="306" y="272" text-anchor="middle" font-size="11.5" fill="#1a1a2e">led by the author;</text>
  <text x="306" y="288" text-anchor="middle" font-size="11.5" fill="#1a1a2e">individual review optional</text>
  <text x="306" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">objectives: quality,</text>
  <text x="306" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">learning, consensus,</text>
  <text x="306" y="340" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">ideas, anomalies</text>
  <rect x="406" y="152" width="176" height="252" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="494" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Technical review</text>
  <text x="494" y="202" text-anchor="middle" font-size="11.5" fill="#1a1a2e">technically qualified</text>
  <text x="494" y="218" text-anchor="middle" font-size="11.5" fill="#1a1a2e">reviewers, led by a moderator</text>
  <text x="494" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">objectives: consensus and</text>
  <text x="494" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">decisions on technical</text>
  <text x="494" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">problems; also anomalies,</text>
  <text x="494" y="290" text-anchor="middle" font-size="11.5" fill="#1a1a2e">quality, ideas, author</text>
  <text x="494" y="306" text-anchor="middle" font-size="11.5" fill="#1a1a2e">improvement</text>
  <rect x="594" y="82" width="176" height="322" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="682" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Inspection</text>
  <text x="682" y="132" text-anchor="middle" font-size="11.5" fill="#1a1a2e">most formal: follows the</text>
  <text x="682" y="148" text-anchor="middle" font-size="11.5" fill="#1a1a2e">complete generic process;</text>
  <text x="682" y="164" text-anchor="middle" font-size="11.5" fill="#1a1a2e">entry + exit criteria</text>
  <text x="682" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">objective: maximum</text>
  <text x="682" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">number of anomalies</text>
  <text x="682" y="220" text-anchor="middle" font-size="11.5" fill="#1a1a2e">metrics improve the SDLC</text>
  <text x="682" y="240" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">the author cannot act as</text>
  <text x="682" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">review leader or scribe</text>
  <line x1="30" y1="428" x2="766" y2="428" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="400" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">formality increases &#8594;</text>
  <text x="400" y="444" text-anchor="middle" font-size="12.5" fill="#1a1a2e">the same work product may be reviewed with different types &#8212; e.g. informal first, inspection later</text>
</svg>
