<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Four Test Estimation Techniques</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">metrics-based vs expert-based &#8212; every estimate rests on assumptions and carries estimation error</text>
  <rect x="30" y="92" width="370" height="140" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="118" font-size="14" font-weight="700" fill="#1a1a2e">1 &#183; Estimation based on ratios</text><text x="50" y="136" font-size="10.5" font-weight="700" fill="#b26a00">metrics-based</text><text x="50" y="158" font-size="11" fill="#1a1a2e">standard ratios from the organization's own previous</text><text x="50" y="174" font-size="11" fill="#1a1a2e">projects &#8212; generally the best source</text><text x="50" y="200" font-size="11.5" font-weight="700" fill="#1a1a2e">dev : test = 3 : 2 &#183; dev 600 pd &#8594; test 400 pd</text>
  <rect x="410" y="92" width="360" height="140" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="430" y="118" font-size="14" font-weight="700" fill="#1a1a2e">2 &#183; Extrapolation</text><text x="430" y="136" font-size="10.5" font-weight="700" fill="#b26a00">metrics-based</text><text x="430" y="158" font-size="11" fill="#1a1a2e">measure as early as possible in the CURRENT project,</text><text x="430" y="174" font-size="11" fill="#1a1a2e">then project the remaining effort (usually a model)</text><text x="430" y="196" font-size="11" font-weight="700" fill="#1a1a2e">very suitable for iterative SDLCs &#8212;</text><text x="430" y="212" font-size="11" fill="#1a1a2e">e.g. next iteration &#8776; average of the last three</text>
  <rect x="30" y="252" width="370" height="140" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="278" font-size="14" font-weight="700" fill="#1a1a2e">3 &#183; Wideband Delphi</text><text x="50" y="296" font-size="10.5" font-weight="700" fill="#b26a00">expert-based &#183; iterative</text><text x="50" y="318" font-size="11" fill="#1a1a2e">each expert estimates in isolation &#8594; collect;</text><text x="50" y="334" font-size="11" fill="#1a1a2e">discuss estimates out of the agreed range;</text><text x="50" y="350" font-size="11" fill="#1a1a2e">re-estimate in isolation &#8594; repeat to consensus</text><text x="50" y="372" font-size="11" font-weight="700" fill="#1a1a2e">Planning Poker = the Agile variant (cards)</text>
  <rect x="410" y="252" width="360" height="140" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="430" y="278" font-size="14" font-weight="700" fill="#1a1a2e">4 &#183; Three-point estimation</text><text x="430" y="296" font-size="10.5" font-weight="700" fill="#b26a00">expert-based</text><text x="430" y="320" font-size="13" font-weight="700" fill="#1a1a2e">E = (a + 4&#183;m + b) / 6</text><text x="430" y="340" font-size="13" font-weight="700" fill="#1a1a2e">SD = (b &#8722; a) / 6</text><text x="430" y="364" font-size="11" fill="#1a1a2e">a=4, m=7, b=16 &#8594; E = 48/6 = 8, SD = 12/6 = 2</text><text x="430" y="380" font-size="11" fill="#1a1a2e">reported as 8 &#177; 2 person-hours (between 6 and 10)</text>
  <text x="400" y="428" text-anchor="middle" font-size="11" fill="#1a1a2e">E leans toward the most-likely estimate m (weight 4 of 6) &#8212; the only technique of the four that states its own error bar</text>
  <text x="400" y="444" text-anchor="middle" font-size="10.5" fill="#1a1a2e">small tasks are usually estimated more accurately &#8212; decompose a large task into smaller ones before estimating</text>
</svg>
