<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Risk level = likelihood &#215; impact &#8212; a 5&#215;5 risk matrix</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">quantitative: level = L &#215; I &#183; qualitative: the level is read from the matrix</text>
  <rect x="120" y="100" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="180" y="100" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="240" y="100" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/><rect x="300" y="100" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/><rect x="360" y="100" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/>
  <rect x="120" y="152" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="180" y="152" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="240" y="152" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/><rect x="300" y="152" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/><rect x="360" y="152" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/>
  <rect x="120" y="204" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="180" y="204" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="240" y="204" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="300" y="204" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/><rect x="360" y="204" width="60" height="52" fill="#f8ddd3" stroke="#1a1a2e"/>
  <rect x="120" y="256" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="180" y="256" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="240" y="256" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="300" y="256" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/><rect x="360" y="256" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/>
  <rect x="120" y="308" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="180" y="308" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="240" y="308" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="300" y="308" width="60" height="52" fill="#e6f2e4" stroke="#1a1a2e"/><rect x="360" y="308" width="60" height="52" fill="#fdf0d9" stroke="#1a1a2e"/>
  <text x="150" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">5</text><text x="210" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">10</text><text x="270" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">15</text><text x="330" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">20</text><text x="390" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">25</text>
  <text x="150" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">4</text><text x="210" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">8</text><text x="270" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">12</text><text x="330" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">16</text><text x="390" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">20</text>
  <text x="150" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">3</text><text x="210" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">6</text><text x="270" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">9</text><text x="330" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">12</text><text x="390" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">15</text>
  <text x="150" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">2</text><text x="210" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">4</text><text x="270" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">6</text><text x="330" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">8</text><text x="390" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">10</text>
  <text x="150" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">1</text><text x="210" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">2</text><text x="270" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">3</text><text x="330" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">4</text><text x="390" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">5</text>
  <rect x="360" y="100" width="60" height="52" fill="none" stroke="#c62828" stroke-width="3"/><rect x="120" y="256" width="60" height="52" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <text x="110" y="130" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a2e">L5</text><text x="110" y="182" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a2e">L4</text><text x="110" y="234" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a2e">L3</text><text x="110" y="286" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a2e">L2</text><text x="110" y="338" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a2e">L1</text>
  <text x="150" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">I1</text><text x="210" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">I2</text><text x="270" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">I3</text><text x="330" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">I4</text><text x="390" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">I5</text>
  <text x="22" y="230" font-size="11" font-weight="700" fill="#1a1a2e" transform="rotate(-90 30 230)">LIKELIHOOD</text>
  <text x="270" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">IMPACT</text>
  <text x="480" y="104" font-size="13" font-weight="700" fill="#1a1a2e">Zones and what they trigger</text>
  <text x="480" y="120" font-size="10" fill="#1a1a2e">(this project's rule — worked example, not doctrine)</text>
  <text x="480" y="140" font-size="11.5" fill="#1a1a2e"><tspan fill="#2e7d32">&#9679;</tspan> level &#8804; 4 &#8212; low: a single smoke check</text>
  <text x="480" y="162" font-size="11.5" fill="#1a1a2e"><tspan fill="#b26a00">&#9679;</tspan> level 5&#8211;11 &#8212; medium: the standard suite</text>
  <text x="480" y="184" font-size="11.5" fill="#1a1a2e"><tspan fill="#c62828">&#9679;</tspan> level &#8805; 12 &#8212; high: exhaustive testing</text>
  <rect x="470" y="200" width="300" height="130" rx="6" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="488" y="226" font-size="13" font-weight="700" fill="#1a1a2e">The worked example, plotted</text>
  <circle cx="496" cy="252" r="6" fill="#c62828"/><text x="510" y="256" font-size="11.5" fill="#1a1a2e">payment defect: L5&#215;I5=25 &#8594; exhaustive</text>
  <circle cx="496" cy="282" r="6" fill="#2e7d32"/><text x="510" y="286" font-size="11.5" fill="#1a1a2e">logging typo: L2&#215;I1=2 &#8594; smoke check</text>
  <text x="488" y="314" font-size="11" fill="#1a1a2e">'touching money' is an impact driver,</text>
  <text x="488" y="328" font-size="11" fill="#1a1a2e">not a bypass of the computation</text>
  <text x="400" y="436" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">the higher the risk level, the more important is its treatment</text>
</svg>
