<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">One neuron, in full: weighted sum, then activation</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">The lesson's worked example &#8212; follow the numbers left to right</text>

  <text x="100" y="136" text-anchor="middle" font-size="12" fill="#1a1a2e">inputs</text>
  <circle cx="100" cy="180" r="30" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">x1 = 2</text>
  <circle cx="100" cy="300" r="30" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="100" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">x2 = 4</text>

  <line x1="130" y1="172" x2="278" y2="214" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="195" y="172" font-size="13" font-weight="700" fill="#1a1a2e">&#215; w1 = 0.5</text>
  <line x1="130" y1="292" x2="278" y2="248" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="195" y="302" font-size="13" font-weight="700" fill="#1a1a2e">&#215; w2 = 0.25</text>

  <circle cx="340" cy="230" r="58" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="340" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">&#931; w&#183;x + b</text>

  <line x1="255" y1="368" x2="310" y2="279" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">bias = -1.5</text>

  <line x1="398" y1="230" x2="538" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="468" y="170" text-anchor="middle" font-size="13.5" fill="#1a1a2e">z = 2&#215;0.5 + 4&#215;0.25 + (-1.5)</text>
  <text x="468" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">= 1 + 1 - 1.5 = 0.5</text>

  <rect x="545" y="200" width="110" height="60" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="600" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">ReLU</text>
  <text x="600" y="245" text-anchor="middle" font-size="12" fill="#1a1a2e">max(0, z)</text>

  <line x1="655" y1="230" x2="686" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="726" cy="230" r="36" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="726" y="226" text-anchor="middle" font-size="11" fill="#1a1a2e">output</text>
  <text x="726" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">0.5</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Multiply each input by its weight, add the bias, apply the activation &#8212; that is the whole neuron.</text>
</svg>
