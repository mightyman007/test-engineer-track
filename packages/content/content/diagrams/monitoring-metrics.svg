<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Test-Monitoring Dashboard</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">metrics show progress, quality and effectiveness &#8212; control turns deviations into directives</text>
  <rect x="30" y="90" width="230" height="150" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="46" y="114" font-size="13.5" font-weight="700" fill="#1a1a2e">Test progress</text><text x="46" y="138" font-size="11" fill="#1a1a2e">&#8226; cases run / not run &#183; passed / failed</text><text x="46" y="156" font-size="11" fill="#1a1a2e">&#8226; test case implementation progress</text><text x="46" y="174" font-size="11" fill="#1a1a2e">&#8226; test environment preparation progress</text><text x="46" y="192" font-size="11" fill="#1a1a2e">&#8226; test execution time</text><text x="46" y="222" font-size="10.5" font-weight="700" fill="#b26a00">am I where the plan says I should be?</text>
  <rect x="285" y="90" width="230" height="150" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="301" y="114" font-size="13.5" font-weight="700" fill="#1a1a2e">Defect</text><text x="301" y="138" font-size="11" fill="#1a1a2e">&#8226; defects found / fixed (with priorities)</text><text x="301" y="156" font-size="11" fill="#1a1a2e">&#8226; defect density = defects &#247; size</text><text x="301" y="174" font-size="11" fill="#1a1a2e">&#8226; defect detection percentage</text><text x="301" y="204" font-size="10.5" font-weight="700" fill="#b26a00">is the found set big enough to stop?</text>
  <rect x="540" y="90" width="230" height="150" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="556" y="114" font-size="13.5" font-weight="700" fill="#1a1a2e">Coverage</text><text x="556" y="138" font-size="11" fill="#1a1a2e">&#8226; requirements coverage</text><text x="556" y="156" font-size="11" fill="#1a1a2e">&#8226; code coverage (module 4)</text><text x="556" y="174" font-size="11" fill="#1a1a2e">&#8226; coverage of product risks,</text><text x="556" y="190" font-size="11" fill="#1a1a2e">&#160;&#160;requirements, acceptance criteria</text><text x="556" y="222" font-size="10.5" font-weight="700" fill="#b26a00">are the exit-criteria targets met?</text>
  <rect x="30" y="260" width="230" height="150" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="46" y="284" font-size="13.5" font-weight="700" fill="#1a1a2e">Risk</text><text x="46" y="308" font-size="11" fill="#1a1a2e">&#8226; residual risk level (lesson 3)</text><text x="46" y="326" font-size="11" fill="#1a1a2e">&#8226; new and changed risks of the period</text><text x="46" y="344" font-size="11" fill="#1a1a2e">&#8226; unmitigated risks at completion</text><text x="46" y="374" font-size="10.5" font-weight="700" fill="#b26a00">what is still left to worry about?</text>
  <rect x="285" y="260" width="230" height="150" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="301" y="284" font-size="13.5" font-weight="700" fill="#1a1a2e">Product quality</text><text x="301" y="308" font-size="11" fill="#1a1a2e">&#8226; availability &#183; response time</text><text x="301" y="326" font-size="11" fill="#1a1a2e">&#8226; mean time to failure</text><text x="301" y="344" font-size="11" fill="#1a1a2e">&#8226; current quality of the test object</text><text x="301" y="374" font-size="10.5" font-weight="700" fill="#b26a00">is the object good enough yet?</text>
  <rect x="540" y="260" width="230" height="150" rx="8" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="2"/><text x="556" y="284" font-size="13.5" font-weight="700" fill="#1a1a2e">Project progress &amp; cost</text><text x="556" y="308" font-size="11" fill="#1a1a2e">&#8226; task completion &#183; resource usage</text><text x="556" y="326" font-size="11" fill="#1a1a2e">&#8226; test effort consumed vs planned</text><text x="556" y="344" font-size="11" fill="#1a1a2e">&#8226; cost of testing &#183; cost of quality</text><text x="556" y="374" font-size="10.5" font-weight="700" fill="#b26a00">do we still fit budget and schedule?</text>
  <text x="400" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">monitoring measures &#8594; control corrects: reprioritize tests &#183; re-evaluate entry/exit criteria after rework</text>
  <text x="400" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">adjust the schedule when the environment slips &#183; add new resources when and where needed</text>
</svg>
