<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Three Families of Test Techniques</text>
  <rect x="280" y="84" width="240" height="48" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="400" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Test basis</text>
  <text x="400" y="122" text-anchor="middle" font-size="11" fill="#1a1a2e">requirements &#183; specs &#183; code &#183; models</text>
  <path d="M 340 132 L 140 166" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 400 132 L 400 166" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 460 132 L 660 166" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="170" width="220" height="180" rx="10" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="140" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Black-box techniques</text>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#1a1a2e">(specification-based)</text>
  <text x="140" y="236" text-anchor="middle" font-size="11" fill="#1a1a2e">based on specified behavior</text>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#1a1a2e">no reference to internals</text>
  <text x="140" y="272" text-anchor="middle" font-size="11" fill="#1a1a2e">EP &#183; BVA &#183; decision tables</text>
  <text x="140" y="290" text-anchor="middle" font-size="11" fill="#1a1a2e">state transitions (module 4)</text>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#1a1a2e">implementation changes &#8594;</text>
  <text x="140" y="326" text-anchor="middle" font-size="11" fill="#1a1a2e">tests stay useful</text>
  <rect x="290" y="170" width="220" height="180" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="400" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">White-box techniques</text>
  <text x="400" y="214" text-anchor="middle" font-size="11" fill="#1a1a2e">(structure-based)</text>
  <text x="400" y="236" text-anchor="middle" font-size="11" fill="#1a1a2e">based on internal structure</text>
  <text x="400" y="254" text-anchor="middle" font-size="11" fill="#1a1a2e">and processing</text>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#1a1a2e">needs design or code first</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#1a1a2e">statement/branch (module 5)</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#1a1a2e">depends on implementation</text>
  <rect x="550" y="170" width="220" height="180" rx="10" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="660" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Experience-based</text>
  <text x="660" y="214" text-anchor="middle" font-size="11" fill="#1a1a2e">(tester knowledge + skill)</text>
  <text x="660" y="236" text-anchor="middle" font-size="11" fill="#1a1a2e">error guessing &#183; exploratory</text>
  <text x="660" y="254" text-anchor="middle" font-size="11" fill="#1a1a2e">checklist-based (module 5)</text>
  <text x="660" y="272" text-anchor="middle" font-size="11" fill="#1a1a2e">effectiveness depends on</text>
  <text x="660" y="290" text-anchor="middle" font-size="11" fill="#1a1a2e">the tester&#8217;s skills</text>
  <text x="660" y="308" text-anchor="middle" font-size="11" fill="#1a1a2e">complementary: finds defects</text>
  <text x="660" y="326" text-anchor="middle" font-size="11" fill="#1a1a2e">the other two miss</text>
  <text x="400" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Coverage = coverage items exercised &#247; total coverage items &#215; 100%</text>
  <text x="400" y="406" text-anchor="middle" font-size="12" fill="#1a1a2e">Each family defines its own coverage items &#8212; partitions, boundaries, columns, states, statements</text>
  <text x="400" y="428" text-anchor="middle" font-size="12" fill="#1a1a2e">A specified coverage level can serve as a measurable exit criterion</text>
</svg>
