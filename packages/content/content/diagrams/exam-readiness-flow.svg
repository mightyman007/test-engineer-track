<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">The mock-exam loop: pass each mock, then prove readiness</text>
  <rect x="30" y="90" width="180" height="110" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="120" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">1. Take a mock exam</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#1a1a2e">40 questions · 60 min</text>
  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#1a1a2e">blueprint-exact draw:</text>
  <text x="120" y="176" text-anchor="middle" font-size="11" fill="#1a1a2e">Ch 8/6/4/11/9/2 · K 8/24/8</text>
  <line x1="214" y1="145" x2="228" y2="145" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="230" y="90" width="180" height="110" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="320" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">2. Score it</text>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="#1a1a2e">pass = 65% (26 of 40)</text>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#1a1a2e">per-chapter bars name</text>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="#1a1a2e">your weakest chapters</text>
  <line x1="414" y1="145" x2="428" y2="145" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="430" y="90" width="180" height="110" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="520" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">3. Readiness check</text>
  <text x="520" y="140" text-anchor="middle" font-size="11" fill="#1a1a2e">mean of your LAST 2</text>
  <text x="520" y="158" text-anchor="middle" font-size="11" fill="#1a1a2e">mocks ≥ 80%?</text>
  <text x="520" y="176" text-anchor="middle" font-size="11" fill="#1a1a2e">(2 attempts minimum)</text>
  <rect x="650" y="90" width="120" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Ready for</text>
  <text x="710" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">the real exam</text>
  <text x="710" y="174" text-anchor="middle" font-size="11" fill="#166534">book it</text>
  <path d="M 560 200 L 560 230 L 710 230 L 710 204" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="635" y="222" text-anchor="middle" font-size="11" fill="#166534">yes — mean ≥ 80%</text>
  <path d="M 480 200 L 480 255 L 340 255 L 340 266" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="410" y="247" text-anchor="middle" font-size="11" fill="#1a1a2e">not yet — below 80%</text>
  <rect x="140" y="270" width="400" height="110" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="340" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Not yet → the weak-chapter loop</text>
  <text x="340" y="318" text-anchor="middle" font-size="11" fill="#1a1a2e">open the report's per-chapter bars — weakest chapter first</text>
  <text x="340" y="336" text-anchor="middle" font-size="11" fill="#1a1a2e">re-read that module's lessons, drill its flashcards,</text>
  <text x="340" y="354" text-anchor="middle" font-size="11" fill="#1a1a2e">then sit the next mock — repeat until ready</text>
  <path d="M 140 325 L 80 325 L 80 206" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#1a1a2e">One passing mock (65%) is not readiness — readiness is the last-2 average, ≥ 80%.</text>
</svg>
