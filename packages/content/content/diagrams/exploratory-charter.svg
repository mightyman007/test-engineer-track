<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Session-Based Exploratory Testing: the Charter</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">tests are simultaneously designed, executed and evaluated while the tester learns about the test object</text>
  <rect x="170" y="100" width="460" height="214" rx="10" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">TEST CHARTER</text>
  <line x1="200" y1="144" x2="600" y2="144" stroke="#1a1a2e" stroke-width="1"/>
  <text x="200" y="170" font-size="12.5" font-weight="700" fill="#1a1a2e">Target &#8212; what to explore:</text>
  <text x="220" y="192" font-size="12" fill="#1a1a2e">the checkout discount rules in the mobile app</text>
  <text x="200" y="222" font-size="12.5" font-weight="700" fill="#1a1a2e">Investigation &#8212; how to explore it:</text>
  <text x="220" y="244" font-size="12" fill="#1a1a2e">how do invalid coupons behave? formats, expiry, reuse&#8230;</text>
  <text x="200" y="274" font-size="12.5" font-weight="700" fill="#1a1a2e">Timebox:</text>
  <text x="220" y="296" font-size="12" fill="#1a1a2e">90 minutes &#8212; the session ends when the box closes</text>
  <rect x="28" y="130" width="126" height="150" rx="6" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="91" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">the charter</text>
  <text x="91" y="176" text-anchor="middle" font-size="11" fill="#1a1a2e">holds the test</text>
  <text x="91" y="192" text-anchor="middle" font-size="11" fill="#1a1a2e">objectives &#8212;</text>
  <text x="91" y="208" text-anchor="middle" font-size="11" fill="#1a1a2e">treated as</text>
  <text x="91" y="224" text-anchor="middle" font-size="11" fill="#1a1a2e">high-level test</text>
  <text x="91" y="240" text-anchor="middle" font-size="11" fill="#1a1a2e">conditions</text>
  <rect x="646" y="110" width="126" height="92" rx="6" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="709" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">DURING</text>
  <text x="709" y="152" text-anchor="middle" font-size="11" fill="#1a1a2e">session sheet:</text>
  <text x="709" y="168" text-anchor="middle" font-size="11" fill="#1a1a2e">steps followed,</text>
  <text x="709" y="184" text-anchor="middle" font-size="11" fill="#1a1a2e">discoveries made</text>
  <rect x="646" y="222" width="126" height="92" rx="6" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="709" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">AFTER</text>
  <text x="709" y="264" text-anchor="middle" font-size="11" fill="#1a1a2e">debrief with the</text>
  <text x="709" y="280" text-anchor="middle" font-size="11" fill="#1a1a2e">stakeholders</text>
  <text x="709" y="296" text-anchor="middle" font-size="11" fill="#1a1a2e">on the results</text>
  <text x="400" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">A time box bounds the session, the charter guides it, a debrief closes it</text>
  <text x="400" y="392" text-anchor="middle" font-size="11.5" fill="#1a1a2e">Useful when specifications are few or inadequate, under time pressure &#8212; or to complement more formal techniques</text>
  <text x="400" y="416" text-anchor="middle" font-size="11.5" fill="#1a1a2e">Coverage items are identified and exercised during the session; it can incorporate other techniques (e.g. EP)</text>
  <text x="400" y="438" text-anchor="middle" font-size="11" fill="#1a1a2e">More effective with experienced testers: domain knowledge, analytical skills, curiosity, creativeness</text>
</svg>
