<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The Test Tool Landscape</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">the syllabus&#8217;s example tool families mapped onto the test-process activities they support</text>
  <rect x="30" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="87" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Planning</text>
  <rect x="155" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="212" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Analysis</text>
  <rect x="280" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="337" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Design</text>
  <rect x="405" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="462" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Implement</text>
  <rect x="530" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="587" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Execution</text>
  <rect x="655" y="84" width="115" height="30" rx="6" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1.5"/><text x="712" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Completion</text>
  <rect x="30" y="124" width="740" height="24" rx="6" fill="#1a1a2e"/><text x="400" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f7f8fb">Monitoring &amp; control &#8212; overhead across the whole flow: compares progress with the plan, adjusts as results come in</text>
  <rect x="30" y="160" width="240" height="82" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="180" font-size="12.5" font-weight="700" fill="#1a1a2e">Test management tools</text><text x="50" y="198" font-size="10" fill="#1a1a2e">manage the SDLC, requirements,</text><text x="50" y="212" font-size="10" fill="#1a1a2e">tests, defects, configuration</text><text x="50" y="230" font-size="10" font-weight="700" fill="#b26a00">supports: plan &#183; M&amp;C &#183; completion</text>
  <rect x="285" y="160" width="240" height="82" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="305" y="180" font-size="12.5" font-weight="700" fill="#1a1a2e">Static testing tools</text><text x="305" y="198" font-size="10" fill="#1a1a2e">support the tester in performing</text><text x="305" y="212" font-size="10" fill="#1a1a2e">reviews and static analysis</text><text x="305" y="230" font-size="10" font-weight="700" fill="#b26a00">supports: analysis (static side)</text>
  <rect x="540" y="160" width="240" height="82" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="560" y="180" font-size="12" font-weight="700" fill="#1a1a2e">Test design &amp; implementation</text><text x="560" y="198" font-size="10" fill="#1a1a2e">generate test cases, test data and</text><text x="560" y="212" font-size="10" fill="#1a1a2e">test procedures (e.g. from models)</text><text x="560" y="230" font-size="10" font-weight="700" fill="#b26a00">supports: design &#183; implementation</text>
  <rect x="30" y="250" width="240" height="82" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="270" font-size="12.5" font-weight="700" fill="#1a1a2e">Test execution &amp; coverage</text><text x="50" y="288" font-size="10" fill="#1a1a2e">automated execution, coverage</text><text x="50" y="302" font-size="10" fill="#1a1a2e">measurement, comparison, logging</text><text x="50" y="320" font-size="10" font-weight="700" fill="#b26a00">supports: execution &amp; coverage</text>
  <rect x="285" y="250" width="240" height="82" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="305" y="270" font-size="12.5" font-weight="700" fill="#1a1a2e">Non-functional testing tools</text><text x="305" y="288" font-size="10" fill="#1a1a2e">testing that is difficult or impossible</text><text x="305" y="302" font-size="10" fill="#1a1a2e">to perform manually (e.g. load)</text><text x="305" y="320" font-size="10" font-weight="700" fill="#b26a00">supports: non-functional execution</text>
  <rect x="540" y="250" width="240" height="82" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="560" y="270" font-size="12.5" font-weight="700" fill="#1a1a2e">DevOps tools</text><text x="560" y="288" font-size="10" fill="#1a1a2e">delivery pipeline, workflow tracking,</text><text x="560" y="302" font-size="10" fill="#1a1a2e">automated builds, CI/CD</text><text x="560" y="320" font-size="10" font-weight="700" fill="#b26a00">supports: CI/CD across the pipeline</text>
  <rect x="30" y="340" width="240" height="82" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="360" font-size="12.5" font-weight="700" fill="#1a1a2e">Collaboration tools</text><text x="50" y="378" font-size="10" fill="#1a1a2e">facilitate communication among the</text><text x="50" y="392" font-size="10" fill="#1a1a2e">team and its stakeholders</text><text x="50" y="410" font-size="10" font-weight="700" fill="#b26a00">supports: communication &amp; M&amp;C</text>
  <rect x="285" y="340" width="240" height="82" rx="8" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/><text x="305" y="360" font-size="12" font-weight="700" fill="#1a1a2e">Scalability &amp; deployment tools</text><text x="305" y="378" font-size="10" fill="#1a1a2e">virtual machines, containerization &#8212;</text><text x="305" y="392" font-size="10" fill="#1a1a2e">standardized, scalable environments</text><text x="305" y="410" font-size="10" font-weight="700" fill="#b26a00">supports: test environments</text>
  <rect x="540" y="340" width="240" height="82" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/><text x="560" y="360" font-size="12.5" font-weight="700" fill="#1a1a2e">Any other tool that assists</text><text x="560" y="378" font-size="10" fill="#1a1a2e">a spreadsheet is a test tool in the</text><text x="560" y="392" font-size="10" fill="#1a1a2e">context of testing</text><text x="560" y="410" font-size="10" font-weight="700" fill="#b26a00">supports: wherever it helps</text>
  <text x="400" y="438" text-anchor="middle" font-size="10.5" fill="#1a1a2e">tools support and facilitate test activities &#8212; testing itself remains a largely intellectual activity (syllabus 1.3)</text>
</svg>
