<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">BDD: From Conversation to Living Documentation</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#1a1a2e">behavior in plain natural language &#8212; usually Given/When/Then &#8212; translated into executable tests</text>
  <rect x="40" y="104" width="340" height="130" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="60" y="132" font-size="13.5" font-weight="700" fill="#1a1a2e">1 &#8226; Three-amigos conversation</text>
  <text x="60" y="158" font-size="12" fill="#1a1a2e">business, development and testing perspectives</text>
  <text x="60" y="180" font-size="12" fill="#1a1a2e">shape the story and its acceptance criteria together</text>
  <text x="60" y="202" font-size="12" fill="#1a1a2e">&#8594; shared understanding, fewer defects of omission</text>
  <rect x="420" y="104" width="340" height="130" rx="10" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="440" y="132" font-size="13.5" font-weight="700" fill="#1a1a2e">2 &#8226; Given/When/Then scenario</text>
  <text x="440" y="156" font-size="12" fill="#1a1a2e">Given a verified target account</text>
  <text x="440" y="176" font-size="12" fill="#1a1a2e">When I transfer $100</text>
  <text x="440" y="196" font-size="12" fill="#1a1a2e">Then the transfer completes</text>
  <text x="440" y="220" font-size="11" fill="#1a1a2e">plain language every stakeholder reads the same way*</text>
  <line x1="384" y1="169" x2="412" y2="169" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="270" width="340" height="130" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="60" y="298" font-size="13.5" font-weight="700" fill="#1a1a2e">3 &#8226; Executable test</text>
  <text x="60" y="324" font-size="12" fill="#1a1a2e">the scenario runs as an automated test &#8212; developers</text>
  <text x="60" y="346" font-size="12" fill="#1a1a2e">write the supporting code while implementing the story</text>
  <text x="60" y="368" font-size="12" fill="#1a1a2e">&#8594; acceptance tests become executable requirements</text>
  <rect x="420" y="270" width="340" height="130" rx="10" fill="#fbf3ee" stroke="#1a1a2e" stroke-width="2"/>
  <text x="440" y="298" font-size="13.5" font-weight="700" fill="#1a1a2e">4 &#8226; Living documentation*</text>
  <text x="440" y="324" font-size="12" fill="#1a1a2e">the automated suite keeps describing the system's</text>
  <text x="440" y="346" font-size="12" fill="#1a1a2e">behavior &#8212; documentation that cannot go stale</text>
  <text x="440" y="368" font-size="12" fill="#1a1a2e">without a failing test saying so</text>
  <path d="M590,238 V256 H210 V266" fill="none" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="384" y1="335" x2="412" y2="335" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="420" text-anchor="middle" font-size="11.5" fill="#1a1a2e">ATDD: tests created prior to implementing the story &#8212; positive first, then negative, then non-functional</text>
  <text x="400" y="440" text-anchor="middle" font-size="11" fill="#1a1a2e">*ubiquitous language and living documentation come from the broader BDD literature &#8212; beyond the CTFL syllabus vocabulary</text>
</svg>
