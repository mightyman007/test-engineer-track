<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">An image is a grid of numbers &#8212; color adds channels</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">Left: one grayscale grid &#183; Right: the stacked tensor a model actually reads</text>

  <text x="185" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">grayscale: one grid</text>
  <g stroke="#1a1a2e" stroke-width="1.5" fill="#ffffff">
    <rect x="100" y="120" width="170" height="136"/>
    <line x1="134" y1="120" x2="134" y2="256"/><line x1="168" y1="120" x2="168" y2="256"/><line x1="202" y1="120" x2="202" y2="256"/><line x1="236" y1="120" x2="236" y2="256"/>
    <line x1="100" y1="154" x2="270" y2="154"/><line x1="100" y1="188" x2="270" y2="188"/><line x1="100" y1="222" x2="270" y2="222"/>
  </g>
  <rect x="202" y="188" width="34" height="34" fill="#eef3fb"/>
  <g font-size="11" fill="#1a1a2e" text-anchor="middle">
    <text x="117" y="142">12</text><text x="151" y="142">240</text><text x="219" y="142">31</text><text x="253" y="142">8</text>
    <text x="117" y="176">200</text><text x="185" y="176">64</text><text x="253" y="176">122</text>
    <text x="117" y="210">77</text><text x="219" y="210" font-weight="700">87</text><text x="253" y="210">19</text>
    <text x="151" y="244">140</text><text x="219" y="244">52</text>
  </g>
  <text x="185" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">one pixel = one number</text>
  <text x="185" y="308" text-anchor="middle" font-size="12" fill="#1a1a2e">height &#215; width</text>

  <line x1="290" y1="195" x2="408" y2="195" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="349" y="182" text-anchor="middle" font-size="12" fill="#1a1a2e">add color:</text>
  <text x="349" y="222" text-anchor="middle" font-size="12" fill="#1a1a2e">3 aligned grids</text>

  <rect x="432" y="185" width="160" height="110" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="452" y="160" width="160" height="110" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="472" y="135" width="160" height="110" fill="#eef3fb" stroke="#1a1a2e" stroke-width="2"/>
  <text x="618" y="195" font-size="14" font-weight="700" fill="#1a1a2e">R</text>
  <text x="598" y="220" font-size="14" font-weight="700" fill="#1a1a2e">G</text>
  <text x="578" y="245" font-size="14" font-weight="700" fill="#1a1a2e">B</text>
  <text x="552" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">color: the tensor</text>
  <text x="552" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">height &#215; width &#215; channels</text>
  <text x="552" y="348" text-anchor="middle" font-size="12" fill="#1a1a2e">three numbers per pixel, stacked</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">One number per grayscale pixel; three per RGB pixel &#8212; the stacked grids are the tensor.</text>
</svg>
