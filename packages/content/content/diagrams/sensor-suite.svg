<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="450" fill="#f7f8fb"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The AV sensor suite: four senses, four blind spots</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#1a1a2e">What each sensor brings &#8212; and where it fails &#8212; is why they ship together</text>

  <rect x="150" y="238" width="140" height="60" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="150" y="238" width="34" height="60" rx="10" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="256" y="238" width="34" height="60" rx="10" fill="#eef3fb" stroke="#1a1a2e" stroke-width="1"/>
  <text x="220" y="272" text-anchor="middle" font-size="12" fill="#1a1a2e">the AV</text>

  <path d="M 292 250 L 420 210 L 420 250 Z" fill="#b26a00" fill-opacity="0.30"/><path d="M 292 286 L 420 286 L 420 326 Z" fill="#b26a00" fill-opacity="0.30"/>
  <text x="352" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#b26a00">camera wedge</text>
  <text x="352" y="218" text-anchor="middle" font-size="10" fill="#b26a00">detail, color, text</text>

  <line x1="292" y1="268" x2="430" y2="168" stroke="#c62828" stroke-width="2.5"/>
  <line x1="292" y1="268" x2="430" y2="248" stroke="#c62828" stroke-width="2.5"/>
  <text x="446" y="182" font-size="11" font-weight="700" fill="#c62828">radar beam &#183; long range + speed</text>
  <text x="446" y="196" font-size="10" fill="#c62828">works in rain, fog, dark</text>

  <circle cx="220" cy="268" r="78" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"/><circle cx="220" cy="268" r="40" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="220" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">lidar ring &#183; precise 3D points</text>
  <text x="220" y="178" text-anchor="middle" font-size="10" fill="#0e7490">degraded by fog &amp; heavy rain</text>

  <path d="M 292 242 L 336 230 M 292 294 L 336 306 M 152 242 L 108 230 M 152 294 L 108 306" stroke="#16a34a" stroke-width="3"/>
  <text x="100" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">ultrasonic</text>
  <text x="100" y="236" text-anchor="middle" font-size="10" fill="#16a34a">only ~5 m</text>

  <g stroke="#1a1a2e" stroke-width="1.5" fill="#ffffff">
    <rect x="520" y="120" width="250" height="62"/><rect x="520" y="190" width="250" height="62"/><rect x="520" y="260" width="250" height="62"/><rect x="520" y="330" width="250" height="62"/>
  </g>
  <circle cx="538" cy="151" r="6" fill="#b26a00"/><text x="552" y="141" font-size="11.5" font-weight="700" fill="#1a1a2e">camera</text>
  <text x="552" y="158" font-size="10.5" fill="#1a1a2e">reads lanes, lights, sign text;</text><text x="552" y="172" font-size="10.5" fill="#1a1a2e">darkness, glare, dirt hurt it</text>
  <circle cx="538" cy="221" r="6" fill="#c62828"/><text x="552" y="211" font-size="11.5" font-weight="700" fill="#1a1a2e">radar</text>
  <text x="552" y="228" font-size="10.5" fill="#1a1a2e">range + speed in any weather;</text><text x="552" y="242" font-size="10.5" fill="#1a1a2e">coarse &#8212; cannot read a sign</text>
  <circle cx="538" cy="291" r="6" fill="#0e7490"/><text x="552" y="281" font-size="11.5" font-weight="700" fill="#1a1a2e">lidar</text>
  <text x="552" y="298" font-size="10.5" fill="#1a1a2e">precise 3D shape of the scene;</text><text x="552" y="312" font-size="10.5" fill="#1a1a2e">fog &amp; snow weaken it; costly</text>
  <circle cx="538" cy="361" r="6" fill="#16a34a"/><text x="552" y="351" font-size="11.5" font-weight="700" fill="#1a1a2e">ultrasonic</text>
  <text x="552" y="368" font-size="10.5" fill="#1a1a2e">short-range close-quarters echo</text><text x="552" y="382" font-size="10.5" fill="#1a1a2e">(parking, curbs) &#8212; no long range</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Fusion combines complementary strengths &#8212; and sensor disagreement is itself a testable signal.</text>
</svg>