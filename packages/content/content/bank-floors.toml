# Per-chapter question-bank floors: minimum questions required per tag.
# Task 2 seeds the ch1 floor only; content tasks 3-8 append their chapter
# floors in the same commit as their content. Floors are independent of exam
# blueprints — they keep banks ahead of M3's mock exams as content grows.
# M1's ch1 bank holds 32 questions, so this floor stays green until Task 3.

[[floor]]
tag = "ch1"
minimum = 30

# Task 3: module 2 ships 33 questions tagged ch2.
[[floor]]
tag = "ch2"
minimum = 33

# Task 4: module 3 ships 33 questions tagged ch3.
[[floor]]
tag = "ch3"
minimum = 33

# Task 6: modules 4 (20) + 5 (18) complete the ch4 bank at 38 questions.
[[floor]]
tag = "ch4"
minimum = 38

# Task 7: module 6 ships 33 questions tagged ch5 — the second-highest-weighted
# exam chapter (9 of 40 questions).
[[floor]]
tag = "ch5"
minimum = 33

# Task 8: module 7 ships 18 questions tagged ch6 — the smallest exam chapter
# (2 of 40 questions), banked at 9x headroom.
[[floor]]
tag = "ch6"
minimum = 18
