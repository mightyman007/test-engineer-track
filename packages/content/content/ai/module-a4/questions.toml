# AI for Test Engineers — Module A4 "Computer Vision Fundamentals"
# 18 original questions (ai-q-0053..0070), all tagged ai4.
#
# Learning objectives (ours — no official syllabus for this track), authored as
# the module's coverage contract. The lo field carries the objective id; every
# objective carries >= 2 questions.
#
# Objectives (A4) — the coverage contract:
#   A4-1 Explain that a computer reads an image as a grid of numbers, and a
#        color image as three aligned grids (channels) forming a tensor.
#   A4-2 Explain what a filter (kernel) does under convolution — sliding over
#        the image, one response per stop — and hand-compute a feature map's
#        dimensions from image size, filter size, and stride.
#   A4-3 Explain how stacked filters build the hierarchy edges → textures →
#        parts → objects, and why convolution suits images: locality, weight
#        sharing (translation robustness), and pooling for scale.
#   A4-4 Distinguish classification / localization / detection / segmentation
#        by what each one outputs.
#   A4-5 Explain what each output shape implies for a test suite's expected
#        results (the oracle follows the output shape).
#
# Coverage: A4-1 x4 (0053-0056), A4-2 x4 (0057-0060), A4-3 x4 (0061-0064),
# A4-4 x4 (0065-0068), A4-5 x2 (0069-0070) — every objective >= 2.
# Recall-style (K1-equivalent) questions: ai-q-0053, 0057, 0058, 0065, 0067
# (5 total; the floor is 4). The rest are understanding-style — plus the
# K3-style hand computation (0059 feature-map dimensions: sizes given in the
# stem, the learner computes the shape).
# 2 multi-select questions (ai-q-0061, ai-q-0068): 5 options, exactly 2 correct.
# NO klevel field on AI questions — standing M4 ruling: no official K
# classification exists, and AI exams use count-only groups.
# Answer positions across the 16 singles: 4 x each of 0/1/2/3 (25% each,
# non-cyclic); the two multi-selects use two different correct-pair positions.
# 2026-11-08 final-review fix: ai-q-0053's key sat on the "list of file paths"
# distractor while the grid-of-numbers option (index 0) is the only defensible
# answer — re-keyed to [0]; ai-q-0055's options 0/1 swapped (keyed-option text
# preserved verbatim) so the 4 x each tally stays honest. The Task-5
# keyed-option-TEXT audit (each keyed option re-read as a statement against its
# stem) was then run over ALL of A4 and A5 — 36 questions; no other mis-keys.
# All stems/options/explanations are original.

[[question]]
id = "ai-q-0053"
type = "single"
stem = "To a computer, a grayscale image is best described as…?"
options = [
  "A grid of numbers, one brightness value per pixel",
  "A list of file paths pointing to the photographed objects",
  "A compressed description written in human language",
  "A set of hand-written rules about shapes and edges",
]
answers = [0]
explanation = "An image enters the machine as a grid of numbers — one value per pixel measuring brightness in grayscale. The other options describe what a human might say about the image, not what the computer receives."
lo = "A4-1"
tags = ["ai4"]

[[question]]
id = "ai-q-0054"
type = "single"
stem = "A color image uses the RGB model. How many numbers describe ONE pixel of that image?"
options = [
  "1 — color images are still a single grid",
  "8 — one number per bit of depth",
  "255 — one number per brightness level",
  "3 — one number per color channel: red, green, and blue",
]
answers = [3]
explanation = "RGB stores three aligned grids, so every pixel carries three numbers: its red, green, and blue intensities. 8 confuses the count with bit depth, and 255 is the maximum value a channel can take, not a count of values."
lo = "A4-1"
tags = ["ai4"]

[[question]]
id = "ai-q-0055"
type = "single"
stem = "In this module's terms, what is a tensor?"
options = [
  "A GPU chip optimized for image arithmetic",
  "A multi-dimensional grid of numbers — for a color image, height × width × channels",
  "A compression format that shrinks images for storage",
  "The list of labels a classifier predicts from",
]
answers = [1]
explanation = "A tensor is the general name for a multi-dimensional grid of numbers; a color image is one with height, width, and channel dimensions. GPUs merely process tensors — the name belongs to the data, not the chip."
lo = "A4-1"
tags = ["ai4"]

[[question]]
id = "ai-q-0056"
type = "single"
stem = "A model was trained on images whose pixel values were scaled to the range 0–1. At test time, a pipeline supplies raw values in the 0–255 range. What happens?"
options = [
  "Nothing — models scale their own inputs automatically",
  "The image displays correctly but is stored at a larger size",
  "Inputs land far outside the trained range, so predictions degrade — a classic preprocessing mismatch",
  "The model quietly re-trains itself on the new value range",
]
answers = [2]
explanation = "Pixel values hundreds of times larger than anything seen in training push inputs far outside the learned range, and prediction quality collapses without any error message. Inference never rescales inputs by itself, and nothing about storage size changes."
lo = "A4-1"
tags = ["ai4"]

[[question]]
id = "ai-q-0057"
type = "single"
stem = "In a convolutional layer, what does a filter (kernel) do?"
options = [
  "It stores one training image for later comparison",
  "It resizes the image to the network's required input dimensions",
  "It slides across the image, multiplying its small number pattern against each patch and summing — flagging where that pattern appears",
  "It chooses which pixels to delete from the image",
]
answers = [2]
explanation = "A filter is a tiny learned grid that slides position by position; each stop multiplies it against the image patch underneath and sums to one response. Resizing is preprocessing, nothing is deleted, and no training image is stored."
lo = "A4-2"
tags = ["ai4"]

[[question]]
id = "ai-q-0058"
type = "single"
stem = "What is a feature map?"
options = [
  "The grid of responses one filter leaves across the whole image — high values mark where its pattern was found",
  "A map of labeled objects drawn by a human annotator",
  "The image's file metadata, such as camera settings",
  "A diagram of the network's layer structure",
]
answers = [0]
explanation = "Sliding one filter over the image produces one response per stop, and the grid of those responses is the feature map. Annotator drawings are ground truth, metadata describes the file, and the layer diagram describes the architecture."
lo = "A4-2"
tags = ["ai4"]

[[question]]
id = "ai-q-0059"
type = "single"
stem = "A 6×6 grayscale image is convolved with a 3×3 filter, stride 1, no padding. What are the dimensions of the resulting feature map?"
options = [
  "6×6 — convolution preserves the input size",
  "5×5 — one position is lost in total",
  "3×3 — the filter's size sets the output size",
  "4×4 — the filter stops at 4 positions per side",
]
answers = [3]
explanation = "Per side, stops = image side − filter side + 1 = 6 − 3 + 1 = 4, so the map is 4×4. 6×6 assumes size preservation, 5×5 subtracts only one position, and 3×3 forgets the +1 entirely."
lo = "A4-2"
tags = ["ai4"]

[[question]]
id = "ai-q-0060"
type = "single"
stem = "Why does a CNN's hierarchy — edges → textures → parts → objects — emerge as layers stack?"
options = [
  "Because each layer memorizes one complete object from the training set",
  "Because each layer's filters read the previous layer's feature maps, combining simple patterns into more complex ones",
  "Because the image is fed to the network again at increasing zoom levels",
  "Because a human labels each layer's patterns during training",
]
answers = [1]
explanation = "Every layer after the first convolves feature maps, not raw pixels — so patterns compose upward from edges to parts to objects. Nothing memorizes whole objects, no zoom is involved, and the hierarchy is learned rather than human-labeled."
lo = "A4-2"
tags = ["ai4"]

[[question]]
id = "ai-q-0061"
type = "multi"
stem = "Which TWO properties make convolutions a good fit for image data?"
options = [
  "Locality: a small filter examines exactly the neighboring pixels that belong together",
  "Weight sharing: the same filter runs at every position, so far fewer numbers must be learned",
  "They require a human-labeled example for every individual pixel",
  "They store the entire training set inside the trained network",
  "They force pixels to be processed in a random order",
]
answers = [0, 1]
explanation = "Images have strong local structure, and a small filter reads exactly that neighborhood; sharing one filter across all positions keeps the learned-number count small and finds patterns wherever they appear. No per-pixel labels, no stored training data, and no random ordering exist."
lo = "A4-3"
tags = ["ai4"]

[[question]]
id = "ai-q-0062"
type = "single"
stem = "A filter that responds to vertical edges finds them whether the edge sits in the image's top-left corner or bottom-right corner. Which convolution property explains this?"
options = [
  "Pooling, which shrinks the feature map",
  "The activation function, which clamps negative responses",
  "Data augmentation applied during training",
  "Weight sharing — the identical filter runs at every position",
]
answers = [3]
explanation = "Because one filter is reused at every stop, a pattern triggers the same response anywhere in the frame — translation robustness for free. Pooling shrinks maps, activations shape values, and augmentation is a training-time trick, none of which moves detection across the image."
lo = "A4-3"
tags = ["ai4"]

[[question]]
id = "ai-q-0063"
type = "single"
stem = "What does a pooling layer do in a CNN?"
options = [
  "It adds new labeled regions to the image",
  "It reverses the convolution to recover the original image",
  "It shrinks each feature map — keeping, per small window, the strongest response — so later layers work on smaller grids",
  "It rotates the image so filters see new orientations",
]
answers = [2]
explanation = "Pooling downsamples: in each window it keeps the strongest response (max pooling), preserving 'the pattern is here' while dropping the exact address. Nothing is labeled, undone, or rotated."
lo = "A4-3"
tags = ["ai4"]

[[question]]
id = "ai-q-0064"
type = "single"
stem = "An image classifier trained on studio-lit product photographs is deployed on grainy night-time footage and mislabels almost everything. From this module's point of view, the most likely explanation?"
options = [
  "The activation function stops working under low light",
  "The night images do not contain the patterns the filters learned — they fall outside what the hierarchy was built on",
  "The feature maps are saved in the wrong file format at night",
  "Pooling merges the night frames into a single image",
]
answers = [1]
explanation = "The filters learned edges, textures, and parts from training imagery; footage far outside that distribution simply does not match the learned patterns. Activations, file formats, and pooling are untouched — this is distribution shift seen from inside the network."
lo = "A4-3"
tags = ["ai4"]

[[question]]
id = "ai-q-0065"
type = "single"
stem = "What does an image-classification model output?"
options = [
  "A single label — usually with a confidence — for the whole image",
  "A bounding box around every object, with no labels attached",
  "A per-pixel class for every location in the image",
  "The image with its background removed",
]
answers = [0]
explanation = "Classification answers one question about the whole image: which class, with what confidence. Boxes belong to detection, per-pixel classes to segmentation, and background removal is an editing operation."
lo = "A4-4"
tags = ["ai4"]

[[question]]
id = "ai-q-0066"
type = "single"
stem = "A parking-garage system must report HOW MANY cars are present and WHERE each one sits. Which vision task fits?"
options = [
  "Object detection — a box, class, and confidence per car, so count and location both come out",
  "Image classification — one label per image",
  "Grayscale conversion — it simplifies the image first",
  "Clustering — the unsupervised paradigm from module A2",
]
answers = [0]
explanation = "Count and location both require per-object outputs, which is exactly detection: one box + label + confidence per car. Classification collapses the whole image to a single label and cannot count; the other two options are not vision tasks that answer the question."
lo = "A4-4"
tags = ["ai4"]

[[question]]
id = "ai-q-0067"
type = "single"
stem = "What does semantic segmentation output?"
options = [
  "One bounding box per detected object",
  "A class for every pixel — a mask tracing each object's exact shape",
  "A single confidence score for the whole image",
  "A short text description of the scene",
]
answers = [1]
explanation = "Segmentation labels every pixel, producing masks that follow the object's true outline rather than a loose rectangle. Boxes are detection's output; the other two options answer the image only in aggregate."
lo = "A4-4"
tags = ["ai4"]

[[question]]
id = "ai-q-0068"
type = "multi"
stem = "A teammate says 'the model detected a pedestrian.' Which TWO outputs would you expect to see backing that claim?"
options = [
  "A single global confidence that the image belongs to the 'pedestrian' class",
  "A segmentation mask tracing the pedestrian's exact outline",
  "A one-line caption describing the scene",
  "A bounding box marking where the pedestrian is",
  "The class label 'pedestrian' attached to that box, with a confidence",
]
answers = [3, 4]
explanation = "A detection claim is a box + class + confidence triple: where, what, how sure. The global confidence is classification's shape, the mask belongs to segmentation, and captions are a different task entirely."
lo = "A4-4"
tags = ["ai4"]

[[question]]
id = "ai-q-0069"
type = "single"
stem = "Why do classification and detection need different shapes of expected results in a test suite?"
options = [
  "Because classification results are always wrong and must be re-checked manually",
  "Because detection models cannot be tested — only classification can",
  "Because the oracle follows the output shape: one label to check versus many box + label + confidence triples to check",
  "Because both tasks ultimately reduce to the same single expected label",
]
answers = [2]
explanation = "A test's expected result must be shaped like the model's output. Classification yields one checkable label; detection yields an unknown-count set of triples, each with class and location that can independently be right or wrong."
lo = "A4-5"
tags = ["ai4"]

[[question]]
id = "ai-q-0070"
type = "single"
stem = "A test fails because the model drew a box around only the lower half of a stop sign — the class label was correct. Which statement is true?"
options = [
  "Classification questions cannot fail this way — reclassify the test as passed",
  "The oracle must accept any box that names the right class",
  "This is not a defect — boxes are only decoration",
  "For detection, a correct class with a wrong box is still wrong — location quality needs its own judgment, a measure the next module defines",
]
answers = [3]
explanation = "Detection has two independent failure directions: wrong class and wrong box. A half-height box on the right class is a real localization defect, and IoU — the standard way to judge box quality — is exactly where module A5 begins."
lo = "A4-5"
tags = ["ai4"]
