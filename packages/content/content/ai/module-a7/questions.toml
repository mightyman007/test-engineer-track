# AI for Test Engineers — Module A7 "AI in the Autonomous-Vehicle Stack"
# 18 original questions (ai-q-0105..0122), all tagged ai7.
#
# Learning objectives (ours — no official syllabus for this track), authored as
# the module's coverage contract. The lo field carries the objective id; every
# objective carries >= 2 questions.
#
# Objectives (A7) — the coverage contract:
#   A7-1 Name the four sensor families (camera, radar, lidar, ultrasonic) and
#        what each physically senses.
#   A7-2 Argue the sensors' strengths/weaknesses and explain why suites fuse
#        them — including sensor disagreement as a testable signal.
#   A7-3 Name the four pipeline stages (perception, prediction, planning,
#        control) and what each consumes and produces.
#   A7-4 Locate object detection inside perception and carry the module A5
#        tie-back: the one-stage vs two-stage trade-off in the AV stack, and
#        why BOTH paradigms exist in production.
#   A7-5 Explain why simulation is indispensable: safety, scale, and
#        scenario coverage beyond any road campaign.
#   A7-6 State what simulation cannot fully capture — synthetic sensor
#        fidelity and the sim-to-real gap — and why sim complements rather
#        than replaces road testing.
#
# Coverage: A7-1 x3 (0105-0107), A7-2 x3 (0108-0110), A7-3 x3 (0111-0113),
# A7-4 x4 (0114-0117), A7-5 x2 (0118-0119), A7-6 x3 (0120-0122) — every
# objective >= 2, and THE A5 TIE-BACK gets its four: 0114-0117 carry the
# "where detection sits + which paradigm fits + why both exist in the field"
# thread, picking up A5's pre-wired reference ("previewing module A7").
