# Track 2 — AI for Test Engineers (M4). No official syllabus exists for this
# track: the learning objectives live in each module's questions.toml header
# as the coverage contract, and the mock blueprint is authored rather than
# reconciled from an official source (M4 Task 7): 30 questions drawn ai1-ai6
# at 4 each and ai7/ai8 at 3, 45 minutes, pass 70% — count-only groups, since
# the AI bank ships klevel-free. readiness_examIds wires the two count-matched
# mocks (ai-mock-1/ai-mock-2, content/exams/) that the validator proves
# assemble from the 140-question AI bank; the TrackPage/Dashboard readiness UI
# consumes these ids.

