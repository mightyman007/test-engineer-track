# Track manifest — Test Engineer Track content root.
# Modules 1-8 shipped. Module 8 (istqb-m8-readiness) is the readiness hub:
# ONE lesson ("How mock exams work"), examWeight 0 (not a syllabus chapter —
# no exam questions draw from it), and INTENTIONALLY EMPTY quiz/deck pools —
# its questions.toml/flashcards.toml are comment-only TOML, which build.ts
# parses as empty pools; the module page renders the track's mock-exam list
# and the readiness indicator instead of a practice section.
# readiness_examIds wires the five blueprint-exact mocks (istqb-mock-1..5,
# content/exams/); the TrackPage/Dashboard readiness UI consumes these ids.
# `readiness_examIds = []` remains valid: the track page shows a placeholder
# until exams are wired (the M4 AI track will start there).

[[track]]
id = "istqb-ctfl"
title = "ISTQB Foundation (CTFL v4.0)"
description = "Prepare for the official ISTQB Certified Tester Foundation Level v4.0 exam: 40 questions, 60 minutes, pass at 65%."
order = 1
readiness_passPct = 65
readiness_readyPct = 80
readiness_examIds = ["istqb-mock-1", "istqb-mock-2", "istqb-mock-3", "istqb-mock-4", "istqb-mock-5"]

[[track.module]]
id = "istqb-m1-fundamentals"
track = "istqb-ctfl"
title = "Fundamentals of Testing"
order = 1
source = "istqb/module-1"
quizPool = "istqb/module-1"
deck = "istqb/module-1"
lessonIds = ["istqb-m1-what-is-testing", "istqb-m1-why-testing", "istqb-m1-seven-principles", "istqb-m1-test-process", "istqb-m1-skills-practices"]
examWeight = 8

[[track.module]]
id = "istqb-m2-sdlc"
track = "istqb-ctfl"
title = "Testing Throughout the SDLC"
order = 2
source = "istqb/module-2"
quizPool = "istqb/module-2"
deck = "istqb/module-2"
lessonIds = ["istqb-m2-sdlc-context", "istqb-m2-test-levels", "istqb-m2-test-types", "istqb-m2-maintenance"]
examWeight = 6

[[track.module]]
id = "istqb-m3-static"
track = "istqb-ctfl"
title = "Static Testing"
order = 3
source = "istqb/module-3"
quizPool = "istqb/module-3"
deck = "istqb/module-3"
lessonIds = ["istqb-m3-static-basics", "istqb-m3-review-process", "istqb-m3-review-types"]
examWeight = 4

[[track.module]]
id = "istqb-m4-blackbox"
track = "istqb-ctfl"
title = "Test Analysis & Design I — Black-Box Techniques"
order = 4
source = "istqb/module-4"
quizPool = "istqb/module-4"
deck = "istqb/module-4"
lessonIds = ["istqb-m4-overview", "istqb-m4-equivalence-partitioning", "istqb-m4-boundary-values", "istqb-m4-decisions-states"]
examWeight = 6   # informational; Ch4's 11 exam questions draw from modules 4+5

[[track.module]]
id = "istqb-m5-whitebox"
track = "istqb-ctfl"
title = "Test Analysis & Design II — White-Box, Experience-Based, Collaboration-Based"
order = 5
source = "istqb/module-5"
