# Track manifest — Test Engineer Track content root.
# Modules 1-7 shipped (M1/M2); module 8 + the mock exams arrive in M3 —
# Task 3 wired readiness_examIds to the five blueprint-exact mocks
# (istqb-mock-1..5, content/exams/); Task 4 replaces TrackPage's readiness
# placeholder with the data-driven readiness UI that consumes these ids.
# `readiness_examIds = []` remains valid: the track page shows that placeholder
# until exams are wired.

[[track]]
id = "istqb-ctfl"
title = "ISTQB Foundation (CTFL v4.0)"
description = "Prepare for the official ISTQB Certified Tester Foundation Level v4.0 exam: 40 questions, 60 minutes, pass at 65%."
order = 1
readiness_passPct = 65
readiness_readyPct = 80
readiness_examIds = ["istqb-mock-1", "istqb-mock-2", "istqb-mock-3", "istqb-mock-4", "istqb-mock-5"]

